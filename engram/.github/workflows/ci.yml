# CI for tiers S (static) and T0 (unit) of PLAN.md section 8.1, plus the non-gating Lean job. Every action is pinned to
# a commit SHA and every tool to an exact version (GUARDRAILS: toolchain pins never float). Tiers T1 to T5 join this
# file in the milestones that own them (M0.4 compose and Temporal, M1.x integration and e2e).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  # Exact toolchain pins. The Go patch is the one go.mod names (`go 1.25.7`, also the build machine's), read by
  # setup-go from go.mod, so there is one source of truth.
  BUF_VERSION: v1.57.2
  GOLANGCI_LINT_VERSION: v2.5.0
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
  PROTOC_GEN_CONNECT_GO_VERSION: v1.21.0
  GOVULNCHECK_VERSION: v1.8.0
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63

jobs:
  static-and-unit:
    name: S + T0 (lint, buf, vet, govulncheck, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # N177: the local test-name list may only shrink against the merge base, and a released prompt's golden may not
      # change; both read origin/main. With this set a checkout without that ref fails the checks (cmd/gendocs and
      # internal/prompts) instead of skipping them.
      ENGRAM_REQUIRE_BASE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main is the merge base of the ratchet and of the released-golden guard

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint keeps its analysis cache outside the Go build cache; without it every run re-analyses the
      # module graph.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: golangci-lint-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Install pinned tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@${PROTOC_GEN_CONNECT_GO_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Tier S. `make lint` runs, in order: buf lint, buf build, buf format -d --exit-code (a proto that fails any
      # of the three blocks the merge; buf breaking is NOT run before v1.0.0, N190); go vet with the build tags
      # integration, faultinject and testauth over the whole stub module; golangci-lint (lll at 120, gofmt,
      # goimports, depguard of the section 2.1 dependency rule, errcheck, staticcheck, unused, gocritic); the
      # method-count lint (at most five methods per interface); scripts/check-line-length.sh (120 columns for
      # every source kind).
      - name: make lint
        run: make lint

      - name: Generated stubs are up to date
        run: |
          make proto
          git diff --exit-code -- gen
          test -z "$(git ls-files --others --exclude-standard -- gen)"

      # N139, N177, N187: the documents under docs/generated and the Go table of register constants are generated by
      # `make gen-docs` (cmd/gendocs) from the migrations, the protos, the plan, the prompt files and the tables under
      # cmd/gendocs, and are never edited by hand. gen-docs itself fails when the sources disagree (enum lint, register
      # constants against the plan, prompt pins, error codes, the test-name index); this step then fails on any
      # difference between what it wrote and what is committed, which is what a hand edit looks like.
      - name: Generated documents are up to date (make gen-docs)
        run: |
          make gen-docs
          git diff --exit-code -- docs/generated internal/gen
          test -z "$(git ls-files --others --exclude-standard -- docs/generated internal/gen)"

      # Tier T0.
      - name: make test-unit
        run: make test-unit

      # Known conflict (CONFLICTS.md #8): the plan pins Go 1.25, whose last patch (1.25.14) still carries stdlib
      # findings that are fixed only in Go 1.26.9 and golang.org/x/net v0.60.0 (go 1.26), and go.mod's 1.25.7 carries
      # more. The scan runs on every push and its output is kept, but it cannot gate until the orchestrator rules on
      # the pin.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

  lake-build:
    name: lake build (non-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Is there a Lean project?
        id: lean
        run: |
          if [ -f formal/lean/lakefile.lean ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "formal/lean is absent (M0.7 creates it); skipping lake build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install elan
        if: steps.lean.outputs.present == 'true'
        run: |
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        if: steps.lean.outputs.present == 'true'
        working-directory: formal/lean
        run: lake build
