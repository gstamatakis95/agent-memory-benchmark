# Nightly `formal-tlc` (PLAN.md sections 7.6 and 8.1 tier F): every configuration of formal/tla/ with a 30-minute cap
# each (`make formal`), compared with formal/tla/EXPECT. A design configuration must end with "No error has been found",
# a must-fail configuration with exactly its named invariant violated; a timeout is INCOMPLETE (reported, neither pass
# nor fail, section 7.6). The TLC jar is pinned by SHA-256 in scripts/formal-jar.sh. The Lean `lake build` is the
# non-gating job of ci.yml.
name: formal-nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  formal-tlc:
    runs-on: ubuntu-24.04
    # 79 configurations, one at a time, 30 minutes at most each; the shipped table sums to 1.6 hours of TLC time and the
    # logs of the four-core build machine to 2.5 hours (a hosted runner stops at 360 minutes)
    timeout-minutes: 360
    env:
      FORMAL_WORKERS: "auto"
      FORMAL_HEAP: 10g
      FORMAL_CAP_SECONDS: "1800"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Use the runner's JDK 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV" && echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Cache the TLC jar (pinned by SHA-256 in scripts/formal-jar.sh)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/engram/tla
          key: tlatools-1.1.0-fc0a7b69b35076b4aeef54228a62fce9ca035f81a19619f5ed3f023f78c803b3
      - name: Manifest check
        run: scripts/formal-manifest-check.sh origin/main
      - name: make formal (every configuration, 30 minutes each)
        run: make formal
      - name: Trace converter proof, every must-fail counterexample through TraceNext
        run: scripts/formal-trace-check.sh proof-all
      - name: Lean sorry count
        run: scripts/sorry-count.sh
