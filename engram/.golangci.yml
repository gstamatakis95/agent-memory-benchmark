# golangci-lint v2 configuration (E3 owns this file from M0.1 on). `lll` enforces the 120-column rule (tabs count as
# 4). `depguard` encodes the dependency rule of PLAN.md section 2.1: one rule per package of internal/ plus adapters/,
# with test files held to the same rules (a test may import its own package, including its fakes such as
# internal/gateway/fakegw, which sit under the package's own path). Leaves and internal/workflows run in `strict` mode
# (everything is denied unless listed); the other layers run in `lax` mode: every import of this module's internal/
# tree is denied except the ones the table and its edge list name, and the more specific allow entry wins over the
# prefix deny. A catch-all rule (`default_internal`) denies every non-leaf internal import for an internal/ directory
# that has no rule yet, so a new package gets no free pass. Leaf modules, exactly: internal/id uuid; internal/pipeline
# go.opentelemetry.io/otel; internal/errs google.golang.org/grpc/status, google.golang.org/grpc/codes, genproto
# googleapis/rpc/status and googleapis/rpc/errdetails (section 4.1.6 mandates errdetails; CONFLICTS.md #10),
# google.golang.org/protobuf and connectrpc.com/connect; fsm and txn none. The import graph is acyclic by construction
# (Go refuses a cycle, N140); `go vet ./...` over the stub module is the M0.1 exit.
#
# Remaining widenings of the table, each with its justification: (1) services, api and infrastructure may import
# third-party modules the table does not list, except the drivers and the Temporal SDK that services and api are
# denied here (section 2.1 reserves drivers for infrastructure: "leaves, gen/go, drivers, and only the edges named
# below", and the Temporal SDK for internal/workflows); (2) infrastructure packages may import any driver (same
# sentence); (3) ledger may import store (CONFLICTS.md #10: section 2.2.24 `Append(ctx, tx, Entry)` needs a store.Tx
# and the edge list omits it); (4) recall, pages, reflectagent and move carry the extra edges of the table's services
# row (reflectagent: recall, pages; pages: recall; move: catalog); (5) pgregory.net/rapid is allowed in the strict
# rules because section 8.1 T1 property tests live next to leaves and workflows; it is not enforced to be test-only;
# (6) workflows also imports go.temporal.io/api and google.golang.org/protobuf, which the Temporal data converter
# needs.
version: "2"
run:
  timeout: 5m
  build-tags: [integration, faultinject, testauth]
linters:
  default: standard
  enable: [lll, depguard, errcheck, govet, staticcheck, unused, ineffassign, misspell, gocritic]
  settings:
    lll:
      line-length: 120
      tab-width: 4
    depguard:
      rules:
        leaf_id:
          files:
            - "**/internal/id/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/gstamatakis95/engram/gen/go
            - pgregory.net/rapid
            - github.com/gstamatakis95/engram/internal/id
            - github.com/gstamatakis95/engram/internal/errs
            - github.com/gstamatakis95/engram/internal/pipeline
            - github.com/gstamatakis95/engram/internal/fsm
            - github.com/gstamatakis95/engram/internal/txn
            - github.com/google/uuid
          deny:
            - pkg: github.com/gstamatakis95/engram/internal
              desc: "a leaf imports only other leaves (PLAN.md section 2.1)"
        leaf_errs:
          files:
            - "**/internal/errs/**"
