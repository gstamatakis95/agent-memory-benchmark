  # ---- prompts (6.1 to 6.6) ----
  - { id: SummaryMaxChars, group: prompts, value: 200, unit: chars, rows: ["§6.1"], witness: "maxLength\": {v}",
      what: "Longest document summary" }
  - { id: ExtractMaxFacts, group: prompts, value: 40, unit: count, rows: ["§6.2"], witness: "≤ {v} facts",
      what: "Facts per chunk the extraction schema allows" }
  - { id: ExtractMaxOutputTokens, group: prompts, value: 4000, unit: tokens, rows: ["§6.2"],
      witness: "{v:k} 000 (≤ 40 facts)", what: "Output cap of extract/v1" }
  - { id: RouteBatchFacts, group: prompts, value: 8, unit: count, rows: ["§6.3"], witness: "≤ {v} facts",
      what: "Facts per consolidation routing call" }
  - { id: RouteMaxCandidates, group: prompts, value: 10, unit: count, rows: ["§6.3"], witness: "at most {v} candidates",
      what: "Candidate observations per routing call" }
  - { id: RouteMaxSourcesPerCandidate, group: prompts, value: 5, unit: count, rows: ["§6.3"],
      witness: "at most {v} quoted sources", what: "Quoted sources per candidate" }
  - { id: RouteMaxTouched, group: prompts, value: 16, unit: count, rows: ["§6.3"], witness: "has\n≤ {v} members",
      what: "Observations touched by one batch (attach targets, new groups, survivors)" }
  - { id: BatchRequeueMax, group: prompts, value: 3, unit: count, rows: ["§6.3"],
      witness: "re-queued at most {v} times",
      what: "A consolidation batch is re-queued at most this often, then failed" }
  - { id: ReflectMaxIterations, group: prompts, value: 10, unit: count, rows: ["§6.5"],
      witness: "≤ {v} free iterations",
      what: "Free tool iterations of a Reflect session after the forced searches" }
  - { id: ReflectContextTokens, group: prompts, value: 100000, unit: tokens, rows: ["§6.5"],
      witness: "{v:k} k-token context cap",
      what: "Context cap of a Reflect session (map/reduce above it)" }
  - { id: ReflectWall, group: prompts, value: 300, unit: s, rows: ["§6.5"], witness: "{v} s wall",
      what: "Wall-clock cap of a Reflect session" }
  - { id: ReflectToolTimeout, group: prompts, value: 10, unit: s, rows: ["§6.5"], witness: "{v} s per tool",
      what: "Timeout of one Reflect tool call" }
  - { id: ReflectMapShards, group: prompts, value: 4, unit: count, rows: ["§6.5"], witness: "≤ {v} shards",
      what: "Shards of the map step at the context cap" }
  # ---- gateway and throughput (D3, D13) ----
  - { id: GatewayRPMCap, group: gateway, value: 600, unit: count, rows: [D3], witness: "{v} RPM",
      what: "Requests per minute of the gateway cap" }
  - { id: CallsPerChunk, group: gateway, value: 3.5, unit: ratio, rows: [D3], witness: "calls_per_chunk ≈ {v}",
      what: "Gateway calls per chunk (extract, summaries, routing, writes, dedup)" }
  - { id: ChunksPerSecPerCell, group: gateway, value: 2.9, unit: ratio, rows: [D3], witness: "≈ {v} chunks/s",
      what: "Retain throughput of one cell at the RPM cap" }
  - { id: ReflectTypicalCostUSD, group: gateway, value: 0.114, unit: ratio, rows: ["§6.8"],
      witness: "(per M) | **${v}**",
      what: "Typical cost in US dollars of one Reflect (mid budget, 6 iterations) at the A-P3 prices" }
# Retry policies of PLAN.md 5.0, "initial / coefficient / max interval / max attempts" (0 attempts = unlimited within
# the activity's ScheduleToClose). Each entry is checked against its row of the section 5.0 table.
policies:
  - { id: PPure, name: P-pure, initial: 0s, coefficient: 0, max_interval: 0s, attempts: 3,
      non_retryable: [everything], used_for: "Chunk, GroupBatches, ApplyDeltaOps" }
  - { id: PDB, name: P-db, initial: 500ms, coefficient: 2.0, max_interval: 10s, attempts: 10,
      non_retryable: [WrongShardOrEpoch, Validation, IntegrityViolation],
      used_for: "every read and write transaction activity" }
  - { id: PFrozen, name: P-frozen, initial: 1s, coefficient: 1.5, max_interval: 5s, attempts: 0,
      non_retryable: [WrongShardOrEpoch, Validation, InputBlobMissing],
      used_for: "write activities that may meet a freeze" }
  - { id: PLLM, name: P-llm, initial: 2s, coefficient: 2.0, max_interval: 60s, attempts: 8,
      non_retryable: [PermanentLLMError, Validation, WrongShardOrEpoch],
      used_for: "gateway structured and chat calls, after quota.Reserve" }
  - { id: PEmbed, name: P-embed, initial: 1s, coefficient: 2.0, max_interval: 30s, attempts: 8,
      non_retryable: [PermanentLLMError, Validation],
      used_for: "gateway embed calls" }
  - { id: PBlob, name: P-blob, initial: 200ms, coefficient: 2.0, max_interval: 5s, attempts: 10,
      non_retryable: [Validation],
      used_for: "blob get, put, list, delete" }
  - { id: PPoll, name: P-poll, initial: 30s, coefficient: 1.0, max_interval: 30s, attempts: 0,
      non_retryable: [PermanentLLMError],
      used_for: "batch-job polling (ScheduleToClose 48 h)" }
  - { id: PCatalog, name: P-catalog, initial: 500ms, coefficient: 2.0, max_interval: 5s, attempts: 20,
      non_retryable: [Validation, MovePrecondition],
      used_for: "catalog transactions in the move" }
  - { id: PCutover, name: P-cutover, initial: 100ms, coefficient: 1.5, max_interval: 1s, attempts: 0,
      non_retryable: [Validation, MovePrecondition],
      used_for: "the cutover sub-step activities (ScheduleToClose 60 s)" }
  - { id: PTemporal, name: P-temporal, initial: 1s, coefficient: 2.0, max_interval: 10s, attempts: 10,
      non_retryable: [Validation],
      used_for: "activities that call the Temporal client" }
