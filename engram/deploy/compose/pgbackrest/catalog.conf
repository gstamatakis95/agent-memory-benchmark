# pgBackRest for stanza catalog (PLAN.md section 9.3): block incremental, zstd, AES-256 repository encryption, on
# an S3 repository under _backups/catalog/. Credentials and the cipher pass come from an include file under
# /run/secrets/pgbackrest.d (PGBACKREST_CONFIG_INCLUDE_PATH), mounted as a secret.
[global]
repo1-type=s3
repo1-s3-endpoint=127.0.0.1:19000
repo1-s3-bucket=engram-dev
repo1-s3-region=local
repo1-s3-uri-style=path
repo1-storage-verify-tls=n
repo1-path=/_backups/catalog
repo1-cipher-type=aes-256-cbc
repo1-block=y
repo1-bundle=y
repo1-retention-full=8
compress-type=zst
process-max=2
archive-async=y
spool-path=/var/spool/pgbackrest
start-fast=y
delta=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[catalog]
pg1-path=/var/lib/postgresql/data
pg1-port=15511
pg1-socket-path=/var/run/postgresql
pg1-user=engram
