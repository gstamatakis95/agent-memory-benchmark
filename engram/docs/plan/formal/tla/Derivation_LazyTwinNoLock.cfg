\* Must fail (N174(1), C7-4): Invalidate and Restore take no exclusive document lock, so they interleave with a lazy
\* twin's read and commit: the twin is born hidden under a tag that Restore already removed (or a later Invalidate
\* replaced) -> RestoreExact.
SPECIFICATION Spec
CONSTANTS
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Twin <- TwinDef
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  Obs = {o1}
  Pages = {}
  MaxVerO = 1
  MaxVerP = 2
  Writers = {w1, w2}
  Budget = 1
  MaxF = 1
  MaxT = 3
  MaxDeletes = 0
  MaxCuration = 2
  MaxRetire = 1
  UseLock = TRUE
  RestoreLock = TRUE
  TombByVersion = TRUE
  EffAllShown = TRUE
  CascadeEvidence = FALSE
  ReextractHides = FALSE
  PageVerify = TRUE
  BaseCheck = TRUE
  MatOnce = FALSE
  AllowAbortW = TRUE
  DropStub = FALSE
  CascadeHidden = FALSE
  MatSignalOnly = FALSE
  CasFirst = FALSE
  RootExpected = TRUE
  AllowRetry = FALSE
  RestoreOnlySelf = FALSE
  RestoreByVisibleTwin = FALSE
  DocLock = FALSE
  TagFromLastLog = FALSE
SYMMETRY Symm
INVARIANTS
  RestoreExact
CHECK_DEADLOCK FALSE
