\* Design configuration, document subject (del, duplicate del, ret) and a tenant delete (N182: the ack follows the last
\* fence; one tenant, two namespaces). Expected: all invariants hold.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 6
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = TRUE
  MaxCatLoss = 1
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
  HelpPrev = FALSE
  TenantAckBeforeFence = FALSE
INVARIANTS
  TypeOK
  AckImpliesIntent
  AckedDeleteSurvives
  NoUnackedEffectOnLaterAck
CHECK_DEADLOCK FALSE
