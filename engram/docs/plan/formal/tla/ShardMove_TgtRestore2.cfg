\* Design configuration (N178): as _TgtRestore with two moves of the namespace, so the restored target's row can be a
\* previous life's `moved_out`; the second move runs from the first target after its cleanup. Expected: all invariants
\* hold.
SPECIFICATION Spec
CONSTANTS
  NRows = 1
  Clients = {c1}
  Life = 1
  MaxT = 4
  Window = 1
  MaxEp = 6
  MaxRestore = 1
  MaxBak = 2
  MaxFault = 0
  AllowAbort = FALSE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  SeqAdvance = TRUE
  ShardTruth = TRUE
  MaxCat = 0
  MaxMoves = 2
  SqSkew = 2
  CopyBeforeFreeze = FALSE
  ReadyBeforeIndex = FALSE
  CutNeedsReplicated = TRUE
  UnionRepair = FALSE
  FloorBeforeCut = TRUE
  FailoverChecksFloor = TRUE
  RestoreCloses = TRUE
  EndFromTargetRow = TRUE
  ThawNeedsReplicated = TRUE
  EpochFromAnyRow = FALSE
SYMMETRY Symm
INVARIANTS
  TypeOK
  SingleWriter
  NoLossNoDup
  RollbackPossibleBeforeC
  NoRouteToTargetBeforeC
  NoWriteToTargetBeforeC
  ZombieCannotCutOver
  RestoreReconciles
  OneOwner
  CatalogNamesOwnerAfterDone
  CleanupSafe
  CopiedBelowTargetSeq
  NoResurrect
  ServedFromIndex
  SourceStaticUnderFreeze
  MoveClosedWhenFinal
  OwnerHasNoStaleMove
