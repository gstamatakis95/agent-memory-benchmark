\* Design configuration (safety + liveness), two moves of the namespace (one row) (the second from the first target,
\* after its cleanup and a backup), young target shard: every started move completes and every ready or active shard's
\* sequence is above its rows (N147). Expected: all hold.
SPECIFICATION Spec
CONSTANTS
  NRows = 1
  Clients = {c1}
  Life = 1
  MaxT = 4
  Window = 1
  MaxEp = 4
  MaxRestore = 0
  MaxBak = 1
  MaxFault = 0
  AllowAbort = FALSE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  SeqAdvance = TRUE
  ShardTruth = TRUE
  MaxCat = 0
  MaxMoves = 2
  SqSkew = 2
  CopyBeforeFreeze = FALSE
  ReadyBeforeIndex = FALSE
  CutNeedsReplicated = TRUE
  UnionRepair = FALSE
  FloorBeforeCut = TRUE
  FailoverChecksFloor = TRUE
  RestoreCloses = TRUE
  EndFromTargetRow = TRUE
  ThawNeedsReplicated = TRUE
  EpochFromAnyRow = FALSE
INVARIANTS
  TypeOK
  SingleWriter
  NoLossNoDup
  RollbackPossibleBeforeC
  OneOwner
  CatalogNamesOwnerAfterDone
  CleanupSafe
  CopiedBelowTargetSeq
  NoResurrect
  ServedFromIndex
  MoveClosedWhenFinal
  OwnerHasNoStaleMove
PROPERTIES
  MoveTerminates
CHECK_DEADLOCK FALSE
