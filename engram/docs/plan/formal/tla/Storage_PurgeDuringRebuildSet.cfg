\* Must fail (N166(6), P-8): purge batches ignore the partition key, so a row purged between the snapshot and the
\* publish of a rebuild is a dead entry of the published graph that nothing counts, and the vacuum that follows repairs
\* it in place -> RebuildBeforeRepair.
SPECIFICATION Spec
CONSTANTS
  Rows = {1, 2, 3}
  MaxGen = 2
  AllowUpdate = FALSE
  FlipEarly = FALSE
  AutoRepair = FALSE
  PartitionUnit = TRUE
  PurgeLock = FALSE
  Ns = {"a", "b"}
  NsOf <- NsOfDef
  Thr <- ThrDef
  PurgeUnmarked = FALSE
INVARIANTS
  RebuildBeforeRepair
CHECK_DEADLOCK FALSE
