// engram/internal/workflow/v1/workflow.proto
//
// Temporal payloads (workflow inputs, activity inputs/results). NEVER served over gRPC; encoded with the Temporal proto
// payload converter. Every input carries a WorkflowScope with (namespace_id, tenant_id, shard_id, epoch) so that
// workers never consult the catalog on the hot path (decision D4): the shard's `namespace_ownership` row verifies the
// epoch inside every activity transaction.
//
// Versioning: package version + `schema_version` on every top-level input. Adding fields is always safe (histories
// replay with defaults); removing or re-interpreting a field requires a `workflow.GetVersion` patch in the workflow
// code and a drain window for running histories (section 4.5).
//
// Pre-1.0 breaking changes are allowed (plan section 4.5). Every top-level input written by the D22 build carries
// `schema_version = 2`; the worker branches on it for in-flight histories started at 1 and keeps that branch until they
// have drained (30 days).
//
// Payload size and confidentiality (decision N59, review F-13/F-18/F-25):
//   * every activity result larger than 4 KiB travels by blob key under the
//     namespace prefix (extraction, embeddings, entity resolution, links); CommitChunkInput is keys-only, so a Temporal
//     history holds ids, hashes and keys — never fact text or vectors — and a document delete reaches it by deleting
//     the blobs;
//   * RetainDocument continues-as-new every 100 chunks or 20 MB of history;
//   * whatever still travels inline is encrypted at rest by a Temporal
//     DataConverter payload codec (AES-256-GCM). Decision N99 (review-2 G-20): the codec uses a PER-NAMESPACE data key
//     wrapped by the shard key (key id in the payload metadata, namespace id in the workflow header); deleting the
//     wrapped data key is the shredding step of a namespace or tenant delete, and a key version is destroyed only after
//     rotation time
//     + max workflow run timeout (7 d) + Temporal retention (7 d). The accurate statement is therefore: text appears in
//     histories only as ciphertext, at most 4 KiB per activity result, plus
//     ChunkWork.header/context/metadata_json/entity_hints; histories expire with retention 7 d and are unreadable after
//     key destruction.
syntax = "proto3";

package engram.internal.workflow.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";

option go_package = "github.com/gstamatakis95/engram/gen/go/engram/internal/workflow/v1;workflowv1";

// WorkflowScope is the fencing token carried by every payload.
message WorkflowScope {
  string namespace_id = 1;
  string tenant_id = 2;
  int32 shard_id = 3;
  // Ownership epoch the operation was submitted under. Activities abort with FAILED_PRECONDITION + WrongShardOrEpoch
  // when the shard disagrees; the move executor restarts the operation with the new epoch after cutover. Every activity
  // is fenced `active` at this epoch, and the expunge and the schedulers skip a namespace while a move is open
  // (decisions N119, N125).
  int64 epoch = 4;
  // Blob key prefix of the shard (= shard_id as text, "7"), so activities build keys without the catalog.
  string blob_prefix = 5;
}

// ResolvedModels snapshots the model configuration at submission so that a workflow is deterministic even if the
// namespace config changes mid-flight.
message ResolvedModels {
  string extract = 1;
  string summarize = 2;
  string consolidate = 3;
  string reflect = 4;
  string embed = 5;
  string rerank = 6;
  // Prompt versions, e.g. "extract/v1".
  string extract_prompt_version = 7;
  string summarize_prompt_version = 8;
  string consolidate_prompt_version = 9;
  string page_prompt_version = 10;
  // Extraction output schema version, part of the cache key.
  string extract_schema_version = 11;
  // Embedding dimensions actually stored (768, or 512 with Matryoshka).
  int32 embed_dims = 12;
}

// TokenUsage is returned by every LLM-calling activity for metering.
message TokenUsage {
  string model = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  int64 cost_micros = 4;
  // True when the extraction/summary cache answered and no call was made.
  bool cache_hit = 5;
}

// RetainDocumentInput starts workflow `ns/{namespace_id}/op/{operation_id}` on task queue `shard-{shard_id}` (decision
// D11).
message RetainDocumentInput {
  // 2 for inputs written by the D22 build.
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  string document_id = 4;
  // Version being built (previous active version + 1).
  int64 version = 5;
  memory.v1.UpdateMode update_mode = 6;
  // ingest_ledger row ids of the items, in item order. Activities read the raw content from the ledger/blob, never from
  // the payload.
  repeated string ledger_ids = 7;
  // SHA-256 of the canonical RetainRequest, for idempotent resubmission.
  string request_hash = 8;
  google.protobuf.Timestamp submitted_at = 9;
  ResolvedModels models = 10;
  // Chunking target from resolved config.
  int32 chunk_target_chars = 11;
  // Union of item tags, for the outbox event.
  repeated string tags = 12;
  // Set only on a continue-as-new run (every 100 chunks or 20 MB of history, decision N59): where the previous run
  // stopped.
  RetainResume resume = 13;
  // `retain.mission` from the submit-time config_snapshot (N25), a prompt input of extract/v1. It is folded into every
  // chunk's render_hash (N87).
  string retain_mission = 14;
}

// RetainResume is the continue-as-new state of RetainDocument. Everything else the new run needs is durable per chunk
// (document_version_chunks) or re-derivable from the manifest blob.
message RetainResume {
  // Index of the next manifest entry to process.
  int32 next_chunk = 1;
  // Blob key of the chunk manifest written by the Chunk activity.
  string manifest_blob_key = 2;
  // Summary id in use for chunk headers (decision N60: recomputed only on REPLACE or > 25 % growth, so a continued run
  // never re-summarises).
  string summary_id = 3;
  int32 chunks_done = 4;
  int32 chunks_failed = 5;
  int32 chunks_reused = 6;
  int32 facts_written = 7;
  // Blob key of the full reconstructed body of the version being built (`{prefix}/ver/{sha256}`, decision N104), so a
  // continued run never re-reads the ledger chain.
  string body_blob_key = 8;
}

// LoadItemResult is the result of the LoadItem activity (decision N56, N104).
message LoadItemResult {
  // APPEND: the version this one extends (the highest existing version below `version`, even one still ingesting); 0
  // for REPLACE.
  int64 append_base_version = 1;
  // Content-addressed blob `{prefix}/ver/{sha256}` holding the FULL reconstructed body of this version, written by
  // LoadItem before the version row is finalised (decision N104): the next APPEND reads this single object instead of
  // walking the ledger chain. Mirrors document_versions.body_key / body_hash.
  string body_blob_key = 2;
  string body_hash = 3;
  // Bytes of the reconstructed body.
  int64 document_bytes = 4;
  // Items whose timestamp was clamped up to the running maximum (N86).
  int32 timestamps_clamped = 5;
}

// ChunkWork is one chunk to process (fan-out unit, ≤ 32 in flight). It carries no chunk text: activities read it from
// the manifest blob written by the Chunk activity (`manifest_blob_key`, entry `ordinal`), so an activity input in the
// Temporal history is a few hundred bytes (decision N59).
message ChunkWork {
  string document_id = 1;
  int64 version = 2;
  // Hex SHA-256 of the chunk text: the chunk identity within the document.
  string content_hash = 3;
  int32 ordinal = 4;
  // "[doc summary] > [heading path]" header prepended for embedding the CHUNK vector and for extraction. Fact vectors
  // are embedded without it (decision N60), so a summary change re-embeds chunks only.
  string header = 6;
  // Offsets into the concatenated item content.
  int32 char_start = 7;
  int32 char_end = 8;
  // Per-item values inherited by the chunk's facts. mentioned_at is the maximum `timestamp` of every item whose bytes
  // the chunk covers (for an APPEND re-chunk also the mentioned_at of every base chunk the new text overlaps),
  // server-set, the only as_of key (decisions D9, N86). It is also the `item_timestamp` the extraction prompt sees; a
  // hard chunk boundary is forced between consecutive items more than 24 h apart, which bounds the relative-date error.
  google.protobuf.Timestamp mentioned_at = 10;
  repeated string tags = 11;
  // Serialised google.protobuf.Struct (JSON) of the item metadata.
  bytes metadata_json = 12;
  repeated memory.v1.EntityHint entity_hints = 13;
  string context = 14;
  // Manifest blob holding the chunk text (`{prefix}/manifests/{operation_id}.json`).
  string manifest_blob_key = 15;
  // sha256(content_hash ‖ heading path ‖ summary id) — decision N60: the header hash compared at FinalizeVersion to
  // decide chunk re-embedding.
  string header_hash = 16;
  // Indexes of every item whose bytes the chunk covers, ascending (decision N86; replaces the singular item_index).
  repeated int32 item_indexes = 17;
  // sha256(day(mentioned_at) ‖ context ‖ canonical(metadata) ‖ sorted(entity_hints) ‖ retain.mission ‖ header_hash) —
  // decision N87. The extraction cache key and chunks.extraction_key are sha256(content_hash ‖ prompt_version ‖ model ‖
  // schema_version ‖ render_hash), so a change to any prompt input is a new key.
  string render_hash = 18;
}

// ChunkPlan is the result of the Chunk activity: the delta against the previous version by content hash (decision D8).
message ChunkPlan {
  // Chunks that need extraction (new hashes).
  repeated ChunkWork new_chunks = 1;
  // Hashes kept from the previous version without work.
  repeated string unchanged_hashes = 2;
  // Tombstoned-but-not-purged hashes to un-retire: `DELETE FROM chunk_tombstones` (decision N115); their facts become
  // visible again.
  repeated string unretired_hashes = 3;
  // Hashes of the previous version absent from the new one (REPLACE only): FinalizeVersion inserts
  // `chunk_tombstones(reason = 'replace')` for them. Nothing on a content row changes (decision N113).
  repeated string retired_hashes = 4;
  // Content hash of the whole version.
  string version_hash = 5;
}

// SummarizeDocumentResult is the document summary used in chunk headers.
message SummarizeDocumentResult {
  // ≤ 200 chars.
  string summary = 1;
  TokenUsage usage = 2;
}

// CausalRelation links two facts of the same chunk by index.
message CausalRelation {
  int32 cause_index = 1;
  int32 effect_index = 2;
  // Extractor confidence in [0, 1].
  float confidence = 3;
}

// EntityMention is an entity as written in a fact.
message EntityMention {
  string mention = 1;
  string type = 2;
  // Populated by ResolveEntities.
  string entity_id = 3;
  string canonical_name = 4;
  bool created = 5;
}

// ExtractedFact is one fact from the extractor (pre-commit; no id yet).
message ExtractedFact {
  int32 index = 1;
  string text = 2;
  memory.v1.FactType fact_type = 3;
  string who = 4;
  string what = 5;
  string when = 6;
  string where = 7;
  string why = 8;
  memory.v1.TemporalWindow occurred = 9;
  // Always the chunk's mentioned_at (= item timestamp), copied by the activity; the extractor cannot set or move it
  // (decision D9, review F-2).
  google.protobuf.Timestamp mentioned_at = 10;
  repeated EntityMention entities = 11;
  // Extractor confidence in [0, 1]; the pipeline section owns the drop threshold.
  float confidence = 12;
  // The extractor's "as said on" date when the chunk quotes or forwards older material; display and ranking only, never
  // a visibility key (D9).
  google.protobuf.Timestamp said_at = 13;
}

// ExtractChunkResult is the structured extraction of one chunk. The facts live in the extraction-cache blob
// (`cache_key`), which is also the result blob: `facts`/`causal` are populated inline only when the whole result is ≤ 4
// KiB (decision N59); otherwise they are empty and CommitChunk reads the blob. Either way the history never carries
// more than 4 KiB of text.
message ExtractChunkResult {
  string content_hash = 1;
  repeated ExtractedFact facts = 2;
  repeated CausalRelation causal = 3;
  TokenUsage usage = 4;
  // Blob key of the cache entry that answered or was written; the authoritative result when `facts` is empty. The key
  // is `{prefix}/xcache/{sha256(content_hash ‖ prompt_version ‖ model ‖ schema_version ‖ render_hash)}.json` (decision
  // N87). A cache entry is deleted by the expunge only when no visible chunk references the hash AND it is older than
  // xcache_grace (24 h, N100).
  string cache_key = 5;
  // Number of facts in the result (so the workflow can plan without reading the blob).
  int32 fact_count = 6;
  // Set with `reason` when extraction failed permanently (the chunk text is still stored and searchable through the
  // chunk arm).
  bool chunk_failed = 7;
  string failure_reason = 8;
}

// Embedding is one L2-normalised vector as little-endian float32 bytes (dims × 4 bytes, 3 KiB at 768-d). Kept inline
// only when the whole result is ≤ 4 KiB — in practice a chunk with no facts; every other result is written to
// `staging_blob_key` and the history carries the key (decision N59; the earlier 512 KiB spill threshold let ≈ 400 KiB
// per chunk into the history).
message Embedding {
  // -1 for the chunk itself, else the fact index.
  int32 fact_index = 1;
  bytes vector = 2;
}

// EmbedChunkResult holds embeddings for the chunk and its facts. CommitChunk inserts them into the insert-only vector
// side tables `fact_vectors` and `chunk_vectors`, keyed by `model` (decision N111); a model change or a header change
// inserts new rows and never updates one.
message EmbedChunkResult {
  string content_hash = 1;
  repeated Embedding embeddings = 2;
  // `{prefix}/staging/{sha256(idempotency key)}.f32`; set instead of `embeddings` whenever the result exceeds 4 KiB
  // (N59).
  string staging_blob_key = 3;
  string model = 4;
  int32 dims = 5;
  // Hash of the header the chunk vector was embedded with (N60).
  string header_hash = 6;
}

// ResolveEntitiesResult maps mentions to entity ids (fuzzy, per namespace).
message ResolveEntitiesResult {
  string content_hash = 1;
  // One per (fact index, mention index), resolved. Inline only when ≤ 4 KiB, else empty and stored at `result_blob_key`
  // (N59).
  repeated EntityMention resolved = 2;
  int32 entities_created = 3;
  string result_blob_key = 4;
}

// LinkType enumerates fact_links kinds.
enum LinkType {
  LINK_TYPE_UNSPECIFIED = 0;
  LINK_TYPE_ENTITY = 1;
  LINK_TYPE_TEMPORAL = 2;
  LINK_TYPE_SEMANTIC = 3;
  LINK_TYPE_CAUSAL = 4;
}

// FactLink is one link to build in CommitChunk.
message FactLink {
  // Source fact index within the chunk.
  int32 src_index = 1;
  // Either an existing fact id or an index within the chunk (dst_index ≥ 0).
  string dst_fact_id = 2;
  int32 dst_index = 3;
  LinkType type = 4;
  float weight = 5;
}

// BuildLinksResult is the link set for one chunk (temporal ≤ 20 per fact, semantic kNN ≤ 10, entity, causal; ≤ 60 per
// fact).
message BuildLinksResult {
  string content_hash = 1;
  // Inline only when ≤ 4 KiB, else empty and stored at `result_blob_key` (N59; 50 facts × 60 links is ≈ 150 KiB).
  repeated FactLink links = 2;
  string result_blob_key = 3;
  int32 link_count = 4;
}

// CommitChunkInput is everything CommitChunk writes in ONE transaction: the chunk row, facts, vectors (side tables,
// N111), mentions, links, the `curation_log` re-application for facts of a known content hash (N115) and the outbox
// event, as inserts only. A missing input blob (purged by a concurrent expunge) fails the activity with the retryable
// InputBlobMissing error (engram.internal.errors.v1, decision N100): the chunk sub-pipeline re-runs ExtractChunk and
// EmbedChunk, at most twice, then records chunk_failed. A shared per-document advisory lock that cannot be taken fails
// it with the retryable DocumentBusy (N83). The input is KEYS-ONLY (decision N59): the activity reads extraction,
// embeddings, resolved entities and links from the blob keys below, so the history does not repeat ≈ 400 KiB per chunk
// and a delete can erase every copy of the text by deleting blobs.
message CommitChunkInput {
  WorkflowScope scope = 1;
  string operation_id = 2;
  ChunkWork chunk = 3;
  // sha256(namespace_id ‖ document_id ‖ version ‖ content_hash). The epoch is deliberately NOT part of the identity:
  // after a move cutover the operation restarts at epoch e+1 on the target, where the chunks already committed at epoch
  // e were copied, and CommitChunk must recognise them as done. The epoch is a fence (checked against
  // namespace_ownership inside the transaction), not an identity component.
  string idempotency_key = 8;
  // Extraction-cache blob holding the facts (ExtractChunkResult.cache_key).
  string extraction_blob_key = 9;
  // Staging blob holding the vectors (EmbedChunkResult.staging_blob_key).
  string embeddings_blob_key = 10;
  // ResolveEntitiesResult.result_blob_key.
  string entities_blob_key = 11;
  // BuildLinksResult.result_blob_key.
  string links_blob_key = 12;
  // Usage of the extract and embed calls, folded into token_usage_events in the same transaction (PD-1).
  repeated TokenUsage usage = 13;
}

// CommitChunkResult reports the committed ids.
message CommitChunkResult {
  string chunk_id = 1;
  repeated string fact_ids = 2;
  int32 links_written = 3;
  // True when the idempotency key already existed (retry after commit).
  bool already_committed = 4;
  // Outbox sequence of the ChunkCommitted event.
  int64 outbox_seq = 5;
}

// FinalizeVersionInput tombstones missing chunks and activates the version. The tombstone subquery is document-scoped
// (decision N107):
// `content_hash NOT IN (SELECT content_hash FROM document_version_chunks WHERE namespace_id = $1 AND document_id = $2
// AND version = $3)`; it inserts `chunk_tombstones(reason = 'replace')` and, for kept chunks whose extraction_key
// differs from the current key, `fact_hidden(cause = 'reextract')` (decisions N58, N115). Both are inserts, and neither
// hides anything derived: observations that name those facts are only flagged `stale_write` and evidence rows are kept
// (a replace and a re-extraction are writes, decision N135).
message FinalizeVersionInput {
  WorkflowScope scope = 1;
  string operation_id = 2;
  string document_id = 3;
  int64 version = 4;
  repeated string retired_hashes = 5;
  repeated string unretired_hashes = 6;
  string version_hash = 7;
}

// FinalizeVersionResult reports what FinalizeVersion did.
message FinalizeVersionResult {
  // Chunk tombstones inserted by this finalize.
  int32 chunks_retired = 1;
  // Facts hidden from the fact and chunk arms through those chunk tombstones (counted, not written).
  int32 facts_retired = 2;
  // Chunk tombstones deleted again because the chunk is back in the version.
  int32 chunks_unretired = 3;
  int64 outbox_seq = 4;
  // Visible facts of kept chunks whose extraction_key differed from the chunk's current key, hidden from the fact and
  // chunk arms by `fact_hidden(cause = 'reextract')` (decision N58: a prompt or model bump never leaves two visible
  // fact sets on a chunk). Derived versions stay visible (decision N135).
  int32 stale_extraction_facts_retired = 5;
  // Content hashes whose header_hash changed and need chunk re-embedding (N60: chunk vectors only).
  repeated string reembed_hashes = 6;
  // Set when a newer version had already started (N40): this version was marked superseded and tombstoned nothing. The
  // operation ends SUCCEEDED with OperationResult.superseded_by set (decisions N49, N127).
  int64 superseded_by = 7;
  // Observations flagged `stale_write` in the same transaction because their current segment names a fact of a
  // tombstoned chunk or an old-key fact (one indexed statement, decision N135).
  int32 observations_flagged_stale = 8;
}

// ConsolidateTrigger is the SignalWithStart payload of the per-namespace Consolidate workflow (id
// `ns/{namespace_id}/consolidate`, debounced 30 s).
message ConsolidateTrigger {
  // 2 for payloads written by the D22 build.
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  ConsolidateReason reason = 3;
  // Facts that changed, as a hint for batch selection (may be empty).
  repeated string fact_ids = 4;
  google.protobuf.Timestamp triggered_at = 5;
}

// ConsolidateReason says what woke consolidation.
enum ConsolidateReason {
  CONSOLIDATE_REASON_UNSPECIFIED = 0;
  CONSOLIDATE_REASON_RETAIN = 1;
  // The expunge materialized a delete: observations whose segment named the victim need a root rebuild (decision N119).
  CONSOLIDATE_REASON_DELETE = 2;
  CONSOLIDATE_REASON_INVALIDATE = 3;
  CONSOLIDATE_REASON_MANUAL = 4;
  CONSOLIDATE_REASON_SCHEDULE = 5;
}

// ConsolidateInput is the Consolidate workflow's own input (first start). Consolidation is two-stage (decision N121):
// stage 1 routes batches of facts against candidate observations (decisions only), stage 2 writes one new version per
// touched observation.
message ConsolidateInput {
  // 2 for inputs written by the D22 build.
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  ResolvedModels models = 3;
  // ≤ 100 facts per round, 8 per routing call (decision N121).
  int32 max_facts_per_round = 4;
  int32 facts_per_call = 5;
  // `consolidate.max_rebuilds_per_round` (decision N66): root rebuilds started per round, so a large delete cannot
  // starve ordinary consolidation.
  int32 max_rebuilds_per_round = 6;
}

// RouteBatchInput is stage 1: one routing call's worth of facts plus candidate observations (top-10 by similarity).
message RouteBatchInput {
  WorkflowScope scope = 1;
  // sha256(sorted fact ids ‖ prompt_version ‖ model).
  string batch_key = 2;
  repeated string fact_ids = 3;
  repeated string candidate_observation_ids = 4;
  ResolvedModels models = 5;
  // Bisect depth (0 = full batch of 8, 1 = 4, 2 = 2, 3 = 1).
  int32 bisect_level = 6;
}

// RoutingKind is one stage-1 decision type (decision N121).
enum RoutingKind {
  ROUTING_KIND_UNSPECIFIED = 0;
  // Attach `fact_ids` to the existing observation `observation_id`.
  ROUTING_KIND_ATTACH = 1;
  // Create a new observation from `fact_ids`.
  ROUTING_KIND_CREATE = 2;
  // Merge `merged_observation_id` into `observation_id` (the survivor): stage 2 writes the survivor as a root rebuild
  // from the union of live sources.
  ROUTING_KIND_MERGE = 3;
  // Remove `fact_ids` as sources of `observation_id`.
  ROUTING_KIND_DROP_SOURCE = 4;
  // The fact is trivial, already covered by a candidate's quoted sources or purely transient: it is stamped `done`
  // without an observation.
  ROUTING_KIND_SKIP = 5;
}

// RoutingDecision is one stage-1 outcome. Nothing textual is persisted from stage 1, so candidate text cannot flow into
// stored content.
message RoutingDecision {
  RoutingKind kind = 1;
  repeated string fact_ids = 2;
  // ATTACH target, MERGE survivor, DROP_SOURCE owner; empty for CREATE.
  string observation_id = 3;
  // MERGE only: the observation folded into the survivor.
  string merged_observation_id = 4;
  // CREATE only: facts of one new facet share a number (1-8).
  int32 new_group = 5;
}

// RouteBatchResult is the stage-1 outcome of one batch.
message RouteBatchResult {
  string batch_key = 1;
  repeated RoutingDecision decisions = 2;
  TokenUsage usage = 3;
  // True when the batch failed and was split.
  bool bisected = 4;
  // Facts that could not be routed even at bisect level 3.
  repeated string failed_fact_ids = 5;
}

// ObservationWriteKind is the stage-2 write type; CREATE, UPDATE and ROOT_REBUILD are the `consolidate_write/v1` modes
// create, update and rebuild, RETIRE is its `retire` action.
enum ObservationWriteKind {
  OBSERVATION_WRITE_KIND_UNSPECIFIED = 0;
  OBSERVATION_WRITE_KIND_CREATE = 1;
  // Next version: previous text, live source quotes and the newly attached facts are shown; root_version is inherited.
  OBSERVATION_WRITE_KIND_UPDATE = 2;
  // Root rebuild (a MERGE survivor, or a rebuild after an expunge or an Invalidate): written from live visible sources
  // only, no previous text shown; root_version = version.
  OBSERVATION_WRITE_KIND_ROOT_REBUILD = 3;
  // The observation lost its last visible source and is retired.
  OBSERVATION_WRITE_KIND_RETIRE = 4;
}

// WriteObservationInput is stage 2: one call per touched observation.
message WriteObservationInput {
  WorkflowScope scope = 1;
  string batch_key = 2;
  // Empty for CREATE.
  string observation_id = 3;
  ObservationWriteKind kind = 4;
  // Facts newly attached by stage 1 (UPDATE/CREATE).
  repeated string attach_fact_ids = 5;
  // Observations folded in by a MERGE (ROOT_REBUILD).
  repeated string merged_observation_ids = 6;
  ResolvedModels models = 7;
}

// ObservationWrite is one persisted stage-2 result, idempotent by op_key.
message ObservationWrite {
  // sha256(batch_key ‖ attempt ‖ op_index); recorded in consolidation_applied.
  string op_key = 1;
  ObservationWriteKind kind = 2;
  // Empty for CREATE.
  string observation_id = 3;
  string text = 4;
  repeated string source_fact_ids = 5;
  repeated string quotes = 6;
  // The facts shown to the writer: these become observation_inputs(O, v) (decision N117), all of them O's own sources
  // (only visible sources are rendered). A strict superset of source_fact_ids.
  repeated string input_fact_ids = 7;
  // UPDATE and MERGE-survivor writes: the version of the target observation whose text the writer was shown. ApplyBatch
  // applies the write only if `observations.current_version = base_version` and the base is visible (the derivation
  // commit rule, decisions N120, N121); 0 for CREATE and ROOT_REBUILD.
  int64 base_version = 8;
}

// WriteObservationResult returns the validated write.
message WriteObservationResult {
  ObservationWrite write = 1;
  TokenUsage usage = 2;
}

// StoreProposalInput persists the validated stage-2 writes of a batch write-once (decision N43), before apply, under
// `(batch_key, attempt)`. A proposal is never updated or deleted: a discard or a capacity retry writes a new attempt
// and the old list is dead by key (decision N121).
message StoreProposalInput {
  WorkflowScope scope = 1;
  // Hex sha256(sorted fact ids ‖ prompt_version ‖ model).
  string batch_key = 2;
  string prompt_version = 6;
  string model = 7;
  repeated ObservationWrite writes = 8;
  // 1-based attempt of the batch (`consolidation_batches.attempt`).
  int32 attempt = 9;
  // "" or "capacity": the capacity re-run is its own attempt with the note "do not use create; attach or merge
  // instead".
  string prompt_variant = 10;
}

// StoreProposalResult returns the list that won (the stored one).
message StoreProposalResult {
  // False when an earlier call of the SAME attempt had already stored a proposal: `writes` is then that list and this
  // call's writes were discarded.
  bool stored_new = 1;
  repeated ObservationWrite writes = 3;
}

// ApplyBatchInput applies the STORED proposal of a batch under the derivation
// lock (decision N120): writers take the shared form, refused → retry.
message ApplyBatchInput {
  WorkflowScope scope = 1;
  string batch_key = 2;
  // The attempt whose stored list is applied.
  int32 attempt = 3;
}

// ApplyOutcome is how ApplyBatch ended.
enum ApplyOutcome {
  APPLY_OUTCOME_UNSPECIFIED = 0;
  APPLY_OUTCOME_APPLIED = 1;
  // Every op_key already existed, or the batch is `applied`: an earlier call committed.
  APPLY_OUTCOME_ALREADY = 2;
  // The derivation commit rule refused the proposal (decision N120): an input fact or the base version's text is no
  // longer visible under the read predicate, or `current_version` moved past a write's base_version. The WHOLE proposal
  // is discarded: `consolidation_batches.state = 'discarded'` with the next attempt in a separate transaction. Nothing
  // is deleted.
  APPLY_OUTCOME_DISCARDED = 3;
  // The scope is at max_observations_per_scope.
  APPLY_OUTCOME_CAPACITY_EXCEEDED = 4;
}

// ApplyBatchResult reports the outcome.
message ApplyBatchResult {
  ApplyOutcome outcome = 1;
  int32 ops_applied = 2;
  // DISCARDED: input facts that are no longer visible (the workflow drops them from the batch and re-queues it with a
  // new batch_key; a batch is re-queued at most 3 times before `failed`).
  repeated string missing_fact_ids = 3;
  // DISCARDED: a write's base observation moved on or became hidden; the batch is re-routed under `next_attempt` with
  // the same batch_key.
  bool base_moved = 5;
  int32 next_attempt = 6;
}

// RefreshPageInput starts a page refresh workflow.
message RefreshPageInput {
  // 2 for inputs written by the D22 build.
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  // Manual refresh: the operation id carried in the nudge to the per-page singleton (REFRESH_PAGE is singleton-backed,
  // decision N157).
  string operation_id = 3;
  string page_id = 4;
  RefreshReason reason = 5;
  // Version the delta edit starts from (0 = full write).
  int64 base_version = 6;
  ResolvedModels models = 7;
  bool force_full_rewrite = 8;
}

// RefreshReason says why a page refresh runs.
enum RefreshReason {
  REFRESH_REASON_UNSPECIFIED = 0;
  REFRESH_REASON_WRITE = 1;
  // Nudged by the expunge or an Invalidate: the current version was hidden or is stale_delete (decision N119); the
  // refresh is always a delta edit from a visible base or a full rewrite when none is visible.
  REFRESH_REASON_DELETE = 2;
  REFRESH_REASON_SCHEDULE = 3;
  REFRESH_REASON_MANUAL = 4;
  REFRESH_REASON_CREATE = 5;
}

// RefreshPageResult reports the new version.
message RefreshPageResult {
  int64 version = 1;
  // Attempt-unique key `pages/{page_id}/v{n}-{sha256(markdown)[:16]}.md`: the rollback branch deletes only the key this
  // execution minted, and only when no page_versions row names it (decision N144).
  string markdown_blob_key = 2;
  google.protobuf.Timestamp effective_at = 3;
  int32 sources_added = 4;
  int32 sources_removed = 5;
  TokenUsage usage = 6;
}

// ExpungeTarget selects what an Expunge run removes (decision N119).
enum ExpungeTarget {
  EXPUNGE_TARGET_UNSPECIFIED = 0;
  // Every pending document tombstone and `fact_hidden` marker of the namespace (or those named in
  // ExpungeInput.document_ids).
  EXPUNGE_TARGET_MARKERS = 1;
  // The whole namespace on this shard after a DeleteNamespace ack: DROP INDEX, batched DELETE, blob prefix; no graph
  // repair (decision N112).
  EXPUNGE_TARGET_NAMESPACE = 2;
  // Chunk tombstones (`replace`, `reextract`) older than the grace of 1 h: rows are purged and the tombstone deleted.
  // Evidence rows stay (decision N135).
  EXPUNGE_TARGET_CHUNK_TOMBSTONES = 3;
  // Vectors of the previous embedding model after a ReembedNamespace flip.
  EXPUNGE_TARGET_OLD_EMBEDDING_MODEL = 4;
  // Facts carrying a `fact_hidden(reextract)` row older than the same 1 h grace: rows, vectors, links, mentions and the
  // marker; the purge writes their `done` stamps (decisions N119, N135).
  EXPUNGE_TARGET_REEXTRACTED_FACTS = 5;
}

// ExpungePhase is the phase shape of the workflow (decisions N119, N136).
enum ExpungePhase {
  EXPUNGE_PHASE_UNSPECIFIED = 0;
  // Under the exclusive derivation lock: insert `derived_hidden`, mark observations and pages `stale_delete`, nudge
  // root rebuilds and refreshes, set `expunge_state = 'materialized'`. SLA ≤ 15 min.
  EXPUNGE_PHASE_MATERIALIZE = 1;
  // Batches of 1,000 paced to ≤ 25 MB/s of WAL: facts, vectors, links, mentions, chunks, versions, explicit-delete
  // ledger rows, then blobs. Evidence rows are not purged here (decision N135). Starts only after every registered
  // index/Kafka cursor passed the tombstone's `event_seq`. SLA ≤ 24 h.
  EXPUNGE_PHASE_PURGE = 2;
  // Index hygiene: a touched HNSW whose purged count reached 1 % of its `rows_at_build` or 2 k elements is rebuilt by
  // the index runner, then `VACUUM (INDEX_CLEANUP ON)` (decision N138). SLA ≤ 48 h.
  EXPUNGE_PHASE_INDEX = 3;
  // `expunge_state = 'purged'`, tombstone dropped 24 h later, operation SUCCEEDED.
  EXPUNGE_PHASE_FINISH = 4;
  // DerivedPurge (decision N136), after Materialize and paced like the purge: covered observation and page versions
  // become content-free stubs, page markdown blobs and Reflect transcripts are deleted.
  EXPUNGE_PHASE_DERIVED_PURGE = 5;
}

// ExpungeInput starts or signals the per-namespace Expunge workflow (id `ns/{namespace_id}/expunge`, SignalWithStart,
// one at a time per namespace). Every activity is fenced `active` at the epoch and skipped while a move is open.
message ExpungeInput {
  // 2 for inputs written by the D22 build.
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  // The DELETE_DOCUMENT / DELETE_NAMESPACE operation this run completes.
  string operation_id = 3;
  ExpungeTarget target = 4;
  // MARKERS only: restrict to these documents; empty = every pending marker.
  repeated string document_ids = 5;
  // Rows per delete batch (default 1,000).
  int32 batch_size = 6;
  // xcache/ecache/staging blobs are deleted only when no visible chunk references the hash AND the blob is older than
  // this (default 24 h, longer than the maximum in-flight activity age; decision N100).
  google.protobuf.Duration xcache_grace = 8;
  // OLD_EMBEDDING_MODEL only.
  string old_embedding_model = 9;
  // WAL budget of the purge in MB/s (default 25): each batch's `pg_current_wal_insert_lsn` delta is measured and the
  // next batch waits so that the shard stays under it (decision N119).
  int32 wal_mb_per_s = 10;
}

// MaterializeInput is the Materialize activity input. Every batch re-reads `fact_hidden` and the open tombstones under
// the exclusive derivation lock; a set computed once fails RestoreExact (decision N120).
message MaterializeInput {
  WorkflowScope scope = 1;
  // Hint only: pending tombstones to materialize (empty = all pending). The work is discovered from the open tombstones
  // and from the partial index `fact_hidden WHERE cause = 'invalidate' AND materialized_at IS NULL`, never from this
  // payload, so a lost signal costs at most one purge-sweep tick (decision N145).
  repeated string document_ids = 2;
  // Hint only: invalidated facts to materialize (an Invalidate nudges a rebuild too). Same rule: the unstamped marker
  // set is the source of truth.
  repeated string fact_ids = 3;
}

// MaterializeResult counts what Materialize hid and nudged.
message MaterializeResult {
  int32 tombstones_materialized = 1;
  int32 observations_hidden = 2;
  int32 pages_hidden = 3;
  int32 rebuilds_nudged = 4;
  int32 refreshes_nudged = 5;
  int64 outbox_seq = 6;
  // Invalidation markers stamped `materialized_at` in the batch that wrote their derived_hidden(invalidation) rows
  // (decision N145).
  int32 invalidations_stamped = 7;
}

// PurgeBatchInput is one purge activity: delete up to batch_size rows of one table for one victim.
message PurgeBatchInput {
  WorkflowScope scope = 1;
  string table = 2;
  // Victim document; empty for NAMESPACE and CHUNK_TOMBSTONES runs.
  string document_id = 3;
  // Resume key of the previous batch (empty before the first).
  bytes last_key = 4;
  int32 batch_size = 5;
  // Lowest outbox cursor among the registered index/Kafka consumers; the purge refuses to start while it is below the
  // tombstone's `event_seq`.
  int64 min_consumer_cursor = 6;
  // MARKERS only: the tombstone's up_to_version. Every delete carries `document_version <= up_to_version`, so rows of a
  // document id that was retained again are never purged (decision N133c).
  int64 up_to_version = 7;
}

// PurgeBatchResult reports one batch.
message PurgeBatchResult {
  int64 rows_deleted = 1;
  bytes last_key = 2;
  bool table_done = 3;
  int64 blobs_tombstoned = 4;
  // WAL bytes the batch wrote, for the pacing loop (decision N119).
  int64 wal_bytes = 5;
}

// DerivedPurgeInput is one DerivedPurge activity batch (decision N136): reduce observation and page versions covered by
// a document-cause `derived_hidden` row to content-free stubs.
message DerivedPurgeInput {
  WorkflowScope scope = 1;
  // Victim document whose cause rows select the versions.
  string document_id = 2;
  // Resume key of the previous batch (empty before the first).
  bytes last_key = 3;
  int32 batch_size = 4;
  int32 wal_mb_per_s = 5;
}

// DerivedPurgeResult reports one batch.
message DerivedPurgeResult {
  // Versions replaced by a stub (version row deleted, stub inserted; inputs, sources, vector row and BM25 entry cascade
  // with the deleted row).
  int64 versions_stubbed = 1;
  // pages/{page_id}/v{n}.md blobs deleted.
  int64 page_blobs_deleted = 2;
  // reflect/{op}.jsonl transcripts of the namespace written before the delete.
  int64 transcripts_deleted = 3;
  bytes last_key = 4;
  bool done = 5;
  int64 wal_bytes = 6;
}

// ExpungeResult reports the whole run.
message ExpungeResult {
  int64 rows_purged = 1;
  int64 blobs_purged = 2;
  int32 batches = 3;
  int32 observations_hidden = 4;
  int32 pages_hidden = 5;
  int32 indexes_rebuilt = 6;
  // Derived versions reduced to stubs and transcripts deleted (decision N136).
  int64 derived_versions_stubbed = 10;
  int64 transcripts_deleted = 11;
  // Time from the tombstone to the end of Materialize / Purge / Index, for the SLA metrics.
  google.protobuf.Duration materialized_after = 7;
  google.protobuf.Duration purged_after = 8;
  google.protobuf.Duration indexed_after = 9;
}

// TenantDeleteInput starts the TenantDelete workflow on the cell-wide `control` task queue (register N36). Before the
// ack the catalog tenant row was set to `deleting` and the tenant-level intent object was written (decision N122); the
// workflow then fences each namespace (`freeze_delete`), writes that namespace's own intent object and runs its
// expunge, at most 8 in parallel.
message TenantDeleteInput {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string operation_id = 3;
  // `_control/deletes/{tenant}/…` key of the intent object (decision N122).
  string intent_object_key = 4;
  // Namespaces to expunge, with their shard and epoch. May be empty for a large tenant: the workflow then pages through
  // the tenant's namespaces with the admin RPC (workers never read the catalog directly, D4).
  repeated NamespaceTarget namespaces = 5;
}

// NamespaceTarget addresses one namespace on one shard at one epoch.
message NamespaceTarget {
  string namespace_id = 1;
  int32 shard_id = 2;
  int64 epoch = 3;
  string operation_id = 4;
}

// RetainBackfillInput starts the RetainBackfill workflow (register N31, a launch prerequisite in the committed scope,
// decision N130): it pre-warms the extraction cache through the gateway batch API (`batch_jobs`) and then runs ordinary
// RetainDocument children.
message RetainBackfillInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  // ingest_ledger row ids of the documents to backfill.
  repeated string ledger_ids = 4;
  ResolvedModels models = 5;
  // Children started in parallel.
  int32 max_children = 6;
}

// ReembedNamespaceInput starts the ReembedNamespace workflow (decision N111): insert new vectors, build the new index,
// flip the namespace's current model, expunge the old.
message ReembedNamespaceInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  string from_model = 4;
  string to_model = 5;
}

// SweeperKind names a per-shard Temporal schedule (register N3, N28).
enum SweeperKind {
  SWEEPER_KIND_UNSPECIFIED = 0;
  // `shard/{id}/op-sweeper`: starts workflows for PENDING operations older than 2 min that have none; completes or
  // deletes `creating` namespaces.
  SWEEPER_KIND_OP = 1;
  SWEEPER_KIND_CONSOLIDATE = 2;
  SWEEPER_KIND_PAGE_CRON = 3;
  // Starts Expunge for namespaces with pending markers or old chunk tombstones.
  SWEEPER_KIND_EXPUNGE = 4;
  SWEEPER_KIND_OUTBOX_TRIM = 5;
  // Creates and drops per-namespace partial HNSW indexes (decision N112).
  SWEEPER_KIND_INDEX = 6;
  // Trims delete intents older than 35 days.
  SWEEPER_KIND_INTENT_TRIM = 7;
}

// SweeperInput is the payload of a sweeper schedule. Writes to `operations` and the outbox go through
// `WithNamespaceTx(write)` (decision N131).
message SweeperInput {
  uint32 schema_version = 1;
  int32 shard_id = 2;
  SweeperKind kind = 3;
}

// ExportInput starts a snapshot workflow. BeginSnapshot inserted the `export_snapshots` row as `building`; WriteFiles
// uses one REPEATABLE READ snapshot; RecordSnapshot refuses to promote an expired row (decision N126).
message ExportInput {
  // 2 for inputs written by the D22 build.
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  int64 version = 4;
  // Previous version for the delta file (0 = none). The delta is a diff of the two snapshots, emitted even when the
  // base expired.
  int64 base_version = 5;
  bool include_chunks = 6;
  bool include_pages = 7;
}

// ExportResult reports the written files.
message ExportResult {
  int64 version = 1;
  string manifest_blob_key = 2;
  int64 total_bytes = 3;
  bool delta_written = 4;
  // Ids deleted since the base snapshot (also in the manifest).
  int64 deleted_id_count = 5;
}

// MoveInput starts the move executor workflow (`move/{namespace_id}/{epoch}`) on the TARGET shard's task queue
// (`shard-{target_shard_id}`, register N2). The executing worker opens a second, move-scoped pool to the source shard
// (role `engram_move`); it is the only code path that holds two shard handles.
// Protocol (freeze-then-copy, decisions N160, N161): plan with the blob pre-warm, freeze, drain, one sequence advance,
// copy every table from the static source by primary-key ranges, VerifyFrozen, BuildIndexes under the freeze, SealCopy
// (the target's WAL archived and standby-replayed through `copy_end_lsn`, decision N179), wait for the outbox
// consumers, cutover with a `ready` state and a catalog CAS as the point of no return, restart, cleanup after 24 h.
message MoveInput {
  // 2 for inputs written by the D22 build.
  uint32 schema_version = 1;
  string move_id = 2;
  string namespace_id = 3;
  string tenant_id = 4;
  int32 source_shard_id = 5;
  int32 target_shard_id = 6;
  int64 source_epoch = 7;
  int64 target_epoch = 8;
  string source_blob_prefix = 9;
  string target_blob_prefix = 10;
  bool pause_before_freeze = 11;
  // W_est computed by Plan (rows / R_copy + build(vectors) + max(wal_build / R_archive, wal_build / R_redo) + verify,
  // decisions N173, N179) and the operator window, at most 8 h. The freeze deadline is
  // `frozen_at + max(1.5 × W_est, W_est + 10 min)`, capped by the window; the workflow rolls back at the deadline
  // unless the catalog CAS (a″) committed.
  google.protobuf.Duration window_estimate = 13;
  google.protobuf.Duration window = 14;
  // Do not freeze before this time (a scheduled window).
  google.protobuf.Timestamp freeze_not_before = 15;
}

// CopyProgress is the FrozenCopy activity's heartbeat and resume payload (decisions N124, N160): the source is static
// under the freeze, so each table is copied in key ranges of ≤ 100,000 rows ordered by primary key, in up to 4 parallel
// streams, WAL-paced; ranges are idempotent upserts, so a crashed copy resumes at `(table, last_key)`.
message CopyProgress {
  string table = 1;
  // Primary-key value of the last row of the last completed range, in the table's key encoding (empty before the first
  // range).
  bytes last_key = 2;
  int64 rows_done = 3;
  // Index of the table in the dependency-ordered copy list.
  int32 table_index = 4;
  // Opaque continuation token of the blob copy listing.
  string blob_token = 5;
}

// CutoverStep names the cutover sub-step last committed (decision N125).
enum CutoverStep {
  CUTOVER_STEP_UNSPECIFIED = 0;
  // (b′) target `incoming → ready`; rollback still possible.
  CUTOVER_STEP_READY_TARGET = 1;
  // (c) source `frozen/move → moved_out`, after (a″) was read and replicated
  // (decision N171).
  CUTOVER_STEP_MOVED_OUT_SOURCE = 2;
  // (b″) target `ready → active`.
  CUTOVER_STEP_ACTIVE_TARGET = 3;
  // (d) catalog flip.
  CUTOVER_STEP_CATALOG_FLIP = 4;
  // (a″) catalog CAS `cutover → committed`: the point of no return.
  CUTOVER_STEP_CATALOG_COMMIT = 5;
}

// VerifyFrozenReport is the VerifyFrozen activity's result (decision N160): on the complete copy of the static source,
// per table count(*) and bit_xor(hashtextextended(pk::text, 0)) over the whole namespace on both sides, VerifyFK on the
// target, and the owner-keyed blob existence of every copied row (copy-if-absent). Hashes are taken per primary-key
// range (`bit_xor` combined in Go) with per-table counts. A mismatch re-copies the mismatching tables once and
// re-verifies; a second mismatch rolls the move back.
message VerifyFrozenReport {
  // Tables whose count or hash differ (empty = match); the excluded class is checked as `count(*)` on the target <= the
  // source's.
  repeated string mismatched_tables = 1;
  bool verify_fk_ok = 2;
  int64 blobs_copied = 3;
  int64 blobs_missing = 4;
  // Verify rounds run (1, or 2 after one mismatch was re-copied).
  int32 attempts = 5;
  // Tables re-copied after the first mismatch.
  repeated string tables_recopied = 6;
}

// SealCopyResult is the SealCopy activity's result (decision N179): `copy_end_lsn` (pg_lsn text form) and its timeline
// from `pg_switch_wal()` on the target after the last index build, the time `pgbackrest check` confirmed the segment
// archived, and the time the target's standby replayed it (unset on the `single` profile).
// `catalog.MoveStamps.RecordFloor` stores the floor.
message SealCopyResult {
  string copy_end_lsn = 1;
  int32 copy_end_timeline = 2;
  google.protobuf.Timestamp archived_at = 3;
  google.protobuf.Timestamp standby_replayed_at = 4;
}

// BuildIndexesReport is the BuildIndexes activity's result (decision N160): the mover requests the partial indexes on
// the target for every (vector table, current model) with at least 2,000 copied vectors, under the freeze, and waits
// until each is `indisvalid AND indisready` (`engram_move_indexes_valid(ns)`). A failed build is retried once, then the
// move rolls back.
message BuildIndexesReport {
  int32 indexes_requested = 1;
  int32 indexes_ready = 2;
  // Builds that failed and were requested again.
  int32 builds_retried = 3;
}

// MoveCheckpoint is persisted after every step so the executor is restartable (decision D5 states).
message MoveCheckpoint {
  string state = 1;
  repeated string tables_done = 4;
  repeated string terminated_operation_ids = 5;
  google.protobuf.Timestamp frozen_at = 6;
  // Workflow ids recorded by Drain from the source `operations` rows in RUNNING/PENDING/DEFERRED plus the namespace
  // singletons (never from Temporal visibility, decision N97). Restart starts each on the target queue with a memo
  // `epoch = e + 1` and WorkflowIDReusePolicy TERMINATE_IF_RUNNING.
  repeated string drained_workflow_ids = 7;
  // Source `pg_control_system().system_identifier` and `pg_control_checkpoint().timeline_id`, recorded by Plan; every
  // later activity on the source re-reads them and fails MoveFenced on mismatch (decision N123).
  uint64 source_system_identifier = 11;
  int32 source_timeline_id = 12;
  // Sub-step last committed.
  CutoverStep cutover_sub_step = 13;
  // The source's final `nextval('engram_ins_seq')` under the freeze; the target's sequence is advanced past it once, at
  // the start of FrozenCopy (engram_seq_advance, decisions N147, N160).
  int64 w_final = 17;
  VerifyFrozenReport verify = 20;
  BuildIndexesReport build_indexes = 21;
  // frozen_at + max(1.5 × W_est, W_est + 10 min), capped by the window; the workflow rolls back at this time unless
  // (a″) committed.
  google.protobuf.Timestamp freeze_deadline = 22;
}

// MoveResult is the terminal outcome.
message MoveResult {
  string final_state = 1;
  int64 rows_copied = 2;
  repeated string restarted_operation_ids = 4;
  string error = 5;
  // VerifyFrozen rounds run (1, or 2 after one mismatch was re-copied).
  int32 verify_attempts = 7;
}
