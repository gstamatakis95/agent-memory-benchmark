\* Must fail (N172, PG7-3): a catalog promotion while the source is frozen; the reconcile takes the epoch from every
\* ownership row, including the target's incoming/ready row at e+1, so the catalog names the owner at an epoch it does
\* not hold and (d) never applies -> CatalogNamesOwnerAfterDone.
SPECIFICATION Spec
CONSTANTS
  NRows = 1
  Clients = {c1}
  Life = 1
  MaxT = 2
  Window = 1
  MaxEp = 4
  MaxRestore = 0
  MaxBak = 0
  MaxFault = 0
  AllowAbort = FALSE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  SeqAdvance = TRUE
  ShardTruth = TRUE
  MaxCat = 1
  MaxMoves = 1
  SqSkew = 2
  CopyBeforeFreeze = FALSE
  ReadyBeforeIndex = FALSE
  CutNeedsReplicated = TRUE
  UnionRepair = FALSE
  FloorBeforeCut = TRUE
  FailoverChecksFloor = TRUE
  RestoreCloses = TRUE
  EndFromTargetRow = TRUE
  ThawNeedsReplicated = TRUE
  EpochFromAnyRow = TRUE
SYMMETRY Symm
INVARIANTS
  CatalogNamesOwnerAfterDone
CHECK_DEADLOCK FALSE
