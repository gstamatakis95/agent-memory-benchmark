# `buf generate` is run from this directory (proto/ in the repository, `make proto`). Output goes to <repo>/gen/go as
# fixed by decision D14. Every file sets go_package explicitly with the module-path prefix
# github.com/gstamatakis95/engram/gen/go (D1, N190), so managed mode is not needed (it would also stamp Java, PHP and
# Ruby options into every descriptor). The plugins run with `module=` and `out: ..` (the repository root) instead of
# paths=source_relative: the three engram.internal.* packages live in proto/engram/internal/... but are generated into
# gen/go/engram/private/..., because Go forbids importing a package whose import path contains an `internal` element
# from outside its parent directory (CONFLICTS entry in docs/briefs/reports/M0.1-report.md).
version: v2
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: ..
    opt:
      - module=github.com/gstamatakis95/engram
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - module=github.com/gstamatakis95/engram
      - require_unimplemented_servers=true
  - local: protoc-gen-connect-go
    out: ..
    opt:
      - module=github.com/gstamatakis95/engram
