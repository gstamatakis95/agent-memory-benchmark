\* Must fail (N144, C-1): the commit runs the base compare-and-set before its idempotency check and a root rebuild is blind; a retried commit advances current_version to a version that does not exist -> NoPhantomVersion.
SPECIFICATION Spec
CONSTANTS
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Twin <- TwinDef
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  Obs = {o1}
  Pages = {}
  MaxVerO = 2
  MaxVerP = 2
  Writers = {w1, w2}
  Budget = 1
  MaxF = 1
  MaxT = 3
  MaxDeletes = 0
  MaxCuration = 0
  MaxRetire = 0
  UseLock = TRUE
  RestoreLock = TRUE
  TombByVersion = TRUE
  EffAllShown = TRUE
  CascadeEvidence = FALSE
  ReextractHides = FALSE
  PageVerify = TRUE
  BaseCheck = TRUE
  MatOnce = FALSE
  AllowAbortW = FALSE
  DropStub = FALSE
  CascadeHidden = FALSE
  MatSignalOnly = FALSE
  CasFirst = TRUE
  RootExpected = FALSE
  AllowRetry = TRUE
  RestoreOnlySelf = FALSE
  RestoreByVisibleTwin = FALSE
SYMMETRY Symm
INVARIANTS
  NoPhantomVersion
CHECK_DEADLOCK FALSE
