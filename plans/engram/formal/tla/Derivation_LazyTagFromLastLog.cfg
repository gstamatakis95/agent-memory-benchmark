\* Must fail (N174(2), PG7-5): the lazy twin takes the tag of the curation_log's last invalidate action and a repeated Invalidate logs a fresh operation id although its rows keep the old one; the twin then carries a tag that Restore of the subject does not resolve -> RestoreExact.
SPECIFICATION Spec
CONSTANTS
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Twin <- TwinDef
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  Obs = {o1}
  Pages = {}
  MaxVerO = 1
  MaxVerP = 2
  Writers = {w1, w2}
  Budget = 1
  MaxF = 1
  MaxT = 3
  MaxDeletes = 0
  MaxCuration = 2
  MaxRetire = 1
  UseLock = TRUE
  RestoreLock = TRUE
  TombByVersion = TRUE
  EffAllShown = TRUE
  CascadeEvidence = FALSE
  ReextractHides = FALSE
  PageVerify = TRUE
  BaseCheck = TRUE
  MatOnce = FALSE
  AllowAbortW = TRUE
  DropStub = FALSE
  CascadeHidden = FALSE
  MatSignalOnly = FALSE
  CasFirst = FALSE
  RootExpected = TRUE
  AllowRetry = FALSE
  RestoreOnlySelf = FALSE
  RestoreByVisibleTwin = FALSE
  DocLock = TRUE
  TagFromLastLog = TRUE
SYMMETRY Symm
INVARIANTS
  RestoreExact
CHECK_DEADLOCK FALSE
