\* Design configuration (liveness): a pending tombstone is eventually done -- 1 observation x 2 versions.
SPECIFICATION Spec
CONSTANTS
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Twin <- TwinDef
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  Obs = {o1}
  Pages = {}
  MaxVerO = 2
  MaxVerP = 2
  Writers = {w1}
  Budget = 2
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 1
  MaxRetire = 0
  UseLock = TRUE
  RestoreLock = TRUE
  TombByVersion = TRUE
  EffAllShown = TRUE
  CascadeEvidence = FALSE
  ReextractHides = FALSE
  PageVerify = TRUE
  BaseCheck = TRUE
  MatOnce = FALSE
  AllowAbortW = FALSE
  DropStub = FALSE
  CascadeHidden = FALSE
  MatSignalOnly = FALSE
  CasFirst = FALSE
  RootExpected = TRUE
  AllowRetry = TRUE
INVARIANTS
  TypeOK
  NoPhantomVersion
  NoGhostInvalidatedServed
  NoDeletedDerivationServed
PROPERTIES
  ExpungeCompletes
CHECK_DEADLOCK FALSE
