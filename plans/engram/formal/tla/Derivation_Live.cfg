\* Design configuration, reduced bounds, with liveness: every tombstone is eventually purged.
\* Facts 1..4: f1,f2 in d1, f3,f4 in d2, mentioned_at 1,2,2,3.
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  DocOf <- DocOfDef
  Mentioned <- MentionedDef
  Obs = {o1, o2}
  Pages = {p1}
  MaxVerO = 2
  MaxVerP = 2
  Writers = {w1}
  Budget = 4
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 2
  UseLock = TRUE
  MatInvalid = FALSE
  EffAllShown = TRUE
INVARIANTS
  NoDeletedDerivationServed
  MaterializeComplete
PROPERTIES
  ExpungeCompletes
CHECK_DEADLOCK FALSE
