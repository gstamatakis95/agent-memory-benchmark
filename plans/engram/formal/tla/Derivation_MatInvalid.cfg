\* Must fail: Materialize also covers invalidated facts with permanent derived_hidden rows ->
\* Restore cannot undo them (RestoreExact, NoOverHiding).
\* Facts 1..3: f1 = (d1,v1), f2 = (d1,v2: id re-used after the delete), f3 = (d2,v1); mentioned_at 1,3,2.
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3}
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Obs = {o1, o2}
  Pages = {p1}
  MaxVerO = 3
  MaxVerP = 2
  Writers = {w1}
  Budget = 5
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 2
  RestoreLock = TRUE
  TombByVersion = TRUE
  UseLock = TRUE
  MatInvalid = TRUE
  EffAllShown = TRUE
SYMMETRY Symm
INVARIANTS
  RestoreExact
  NoOverHiding
CHECK_DEADLOCK FALSE
