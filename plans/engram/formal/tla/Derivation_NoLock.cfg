\* Must fail: no derivation lock -- a writer that re-verified before the marker commits after Materialize,
\* and Purge then deletes the evidence that named the victim -> NoDeletedDerivationServed.
\* Facts 1..4: f1,f2 in d1, f3,f4 in d2, mentioned_at 1,2,2,3.
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  DocOf <- DocOfDef
  Mentioned <- MentionedDef
  Obs = {o1, o2}
  Pages = {p1}
  MaxVerO = 3
  MaxVerP = 2
  Writers = {w1}
  Budget = 5
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 2
  UseLock = FALSE
  MatInvalid = FALSE
  EffAllShown = TRUE
SYMMETRY Symm
INVARIANTS
  NoDeletedDerivationServed
CHECK_DEADLOCK FALSE
