\* Design configuration, 1 observation x 2 versions and 1 page x 2 versions.  Expected: all invariants hold.
\* Facts 1..3: f1 = (d1,v1), f2 = (d1,v2: id re-used after the delete), f3 = (d2,v1); mentioned_at 1,3,2.
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3}
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Obs = {o1}
  Pages = {p1}
  MaxVerO = 2
  MaxVerP = 2
  Writers = {w1}
  Budget = 5
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 2
  RestoreLock = TRUE
  TombByVersion = TRUE
  UseLock = TRUE
  MatInvalid = FALSE
  EffAllShown = TRUE
INVARIANTS
  TypeOK
  NoDeletedDerivationServed
  NoInvalidatedDerivationServed
  RestoreExact
  NoOverHiding
  AsOfNoLeak
  MaterializeComplete
CHECK_DEADLOCK FALSE
