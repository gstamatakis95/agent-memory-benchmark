\* Design configuration, 1 observation x 1 version and 1 page x 2 versions, 2 writers (REPLACE and re-extraction are in Derivation.cfg).  Expected: all invariants hold.
SPECIFICATION Spec
CONSTANTS
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Twin <- TwinDef
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3, 4}
  Obs = {o1}
  Pages = {p1}
  MaxVerO = 1
  MaxVerP = 2
  Writers = {w1, w2}
  Budget = 3
  MaxF = 1
  MaxT = 3
  MaxDeletes = 1
  MaxCuration = 1
  MaxRetire = 0
  UseLock = TRUE
  RestoreLock = TRUE
  TombByVersion = TRUE
  EffAllShown = TRUE
  CascadeEvidence = FALSE
  ReextractHides = FALSE
  PageVerify = TRUE
  BaseCheck = TRUE
  MatOnce = FALSE
  AllowAbortW = TRUE
  DropStub = FALSE
  CascadeHidden = FALSE
  MatSignalOnly = FALSE
  CasFirst = FALSE
  RootExpected = TRUE
  AllowRetry = TRUE
  RestoreOnlySelf = FALSE
  RestoreByVisibleTwin = FALSE
  DocLock = TRUE
  TagFromLastLog = FALSE
SYMMETRY Symm
INVARIANTS
  TypeOK
  NoPhantomVersion
  NoGhostInvalidatedServed
  NoDeletedDerivationServed
  NoInvalidatedDerivationServed
  RestoreExact
  TagFromLog
  NoOverHiding
  AsOfNoLeak
