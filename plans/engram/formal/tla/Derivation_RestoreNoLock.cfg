  Pages = {}
  MaxVerO = 1
  MaxVerP = 2
  Writers = {w1, w2}
  Budget = 1
  MaxF = 1
  MaxT = 3
  MaxDeletes = 0
  MaxCuration = 2
  MaxRetire = 0
  UseLock = TRUE
  RestoreLock = FALSE
  TombByVersion = TRUE
  EffAllShown = TRUE
  CascadeEvidence = FALSE
  ReextractHides = FALSE
  PageVerify = TRUE
  BaseCheck = TRUE
  MatOnce = FALSE
  AllowAbortW = TRUE
  DropStub = FALSE
  CascadeHidden = FALSE
  MatSignalOnly = FALSE
  CasFirst = FALSE
  RootExpected = TRUE
  AllowRetry = FALSE
  RestoreOnlySelf = FALSE
  RestoreByVisibleTwin = FALSE
SYMMETRY Symm
INVARIANTS
  RestoreExact
CHECK_DEADLOCK FALSE
