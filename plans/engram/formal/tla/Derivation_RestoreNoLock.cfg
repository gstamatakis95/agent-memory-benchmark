  MaxVerP = 2
  Writers = {w1}
  Budget = 5
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 2
  RestoreLock = FALSE
  TombByVersion = TRUE
  UseLock = TRUE
  MatInvalid = FALSE
  EffAllShown = TRUE
SYMMETRY Symm
