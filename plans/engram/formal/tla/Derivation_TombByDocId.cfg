\* Must fail: a tombstone hides the whole document id, so the re-used id (f2) is hidden by the old
\* tombstone -> NoOverHiding.
\* Facts 1..3: f1 = (d1,v1), f2 = (d1,v2: id re-used after the delete), f3 = (d2,v1); mentioned_at 1,3,2.
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Facts = {1, 2, 3}
  DocOf <- DocOfDef
  FVer <- FVerDef
  Mentioned <- MentionedDef
  Obs = {o1, o2}
  Pages = {}
  MaxVerO = 3
  MaxVerP = 2
  Writers = {w1}
  Budget = 5
  MaxF = 1
  MaxT = 3
  MaxDeletes = 2
  MaxCuration = 2
  RestoreLock = TRUE
  TombByVersion = FALSE
  UseLock = TRUE
  MatInvalid = FALSE
  EffAllShown = TRUE
SYMMETRY Symm
INVARIANTS
  NoOverHiding
  RestoreExact
CHECK_DEADLOCK FALSE
