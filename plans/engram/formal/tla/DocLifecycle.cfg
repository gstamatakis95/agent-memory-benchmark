\* Design, async index, full bounds (safety; liveness in DocLifecycle_Live.cfg).  Expected: all hold.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Hashes = {h1, h2, h3}
  MaxVersion = 2
  Obs = {o1, o2, o3}
  MaxConsolidations = 3
  IndexMode = "async"
  FilterIndexByStore = TRUE
  CommitChecksVersion = TRUE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
SYMMETRY Symm
INVARIANTS
  TypeOK
  NoOrphanLinks
  NoObservationCitesDeletedAfterAck
  NoDeletedContentRecalled
  ObservationHasSources
  OneActiveVersion
  VersionsConsistent
