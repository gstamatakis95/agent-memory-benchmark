\* N77 CI gate, async index: design invariants at bounds shrunk until the run completes in minutes.  Expected: all hold.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Hashes = {h1, h2}
  MaxVersion = 2
  Obs = {o1, o2}
  MaxConsolidations = 2
  IndexMode = "async"
  FilterIndexByStore = TRUE
  CommitChecksVersion = TRUE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
SYMMETRY Symm
INVARIANTS
  TypeOK
  NoOrphanLinks
  NoObservationCitesDeletedAfterAck
  NoDeletedContentRecalled
  ObservationHasSources
  OneActiveVersion
  VersionsConsistent
