\* Design, async index, minimal bounds, no symmetry: liveness IndexConverges under WF(Relay).
\* (2 docs x 2 hashes x 1 obs exceeds the 10-minute CI cap under liveness checking.)
SPECIFICATION Spec
CONSTANTS
  Docs = {d1}
  Hashes = {h1, h2}
  MaxVersion = 2
  Obs = {o1}
  MaxConsolidations = 1
  IndexMode = "async"
  FilterIndexByStore = TRUE
  CommitChecksVersion = TRUE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
INVARIANTS
  NoDeletedContentRecalled
  ObservationHasSources
PROPERTIES
  IndexConverges
