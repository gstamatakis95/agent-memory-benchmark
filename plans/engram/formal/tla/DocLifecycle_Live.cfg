\* Design, async index, reduced bounds, no symmetry: liveness IndexConverges under WF(Relay).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Hashes = {h1, h2}
  MaxVersion = 2
  Obs = {o1}
  MaxConsolidations = 1
  IndexMode = "async"
  FilterIndexByStore = TRUE
  CommitChecksVersion = TRUE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
INVARIANTS
  NoDeletedContentRecalled
PROPERTIES
  IndexConverges
