\* Counterexample: CommitChunk does not check document_versions.status.  Expected: VersionsConsistent violated.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Hashes = {h1, h2}
  MaxVersion = 2
  Obs = {o1, o2}
  MaxConsolidations = 2
  IndexMode = "tx"
  FilterIndexByStore = TRUE
  CommitChecksVersion = FALSE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
SYMMETRY Symm
INVARIANTS
  TypeOK
  NoOrphanLinks
  NoObservationCitesDeletedAfterAck
  NoDeletedContentRecalled
  ObservationHasSources
  OneActiveVersion
  VersionsConsistent
