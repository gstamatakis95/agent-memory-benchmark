\* Design, transactional index, reduced bounds (3 hashes, 2 obs, 2 consolidations).  Expected: all hold.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Hashes = {h1, h2, h3}
  MaxVersion = 2
  Obs = {o1, o2}
  MaxConsolidations = 2
  IndexMode = "tx"
  FilterIndexByStore = TRUE
  CommitChecksVersion = TRUE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
SYMMETRY Symm
INVARIANTS
  TypeOK
  NoOrphanLinks
  NoObservationCitesDeletedAfterAck
  NoDeletedContentRecalled
  ObservationHasSources
  OneActiveVersion
  VersionsConsistent
