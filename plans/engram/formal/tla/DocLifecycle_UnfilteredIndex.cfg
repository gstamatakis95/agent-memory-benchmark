\* Counterexample: async index hits not filtered by store liveness.  Expected: NoDeletedContentRecalled violated.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Hashes = {h1, h2}
  MaxVersion = 2
  Obs = {o1, o2}
  MaxConsolidations = 2
  IndexMode = "async"
  FilterIndexByStore = FALSE
  CommitChecksVersion = TRUE
  FinalizeChecksNewer = TRUE
  ApplyCheck = "batch"
SYMMETRY Symm
INVARIANTS
  TypeOK
  NoOrphanLinks
  NoObservationCitesDeletedAfterAck
  NoDeletedContentRecalled
  ObservationHasSources
  OneActiveVersion
  VersionsConsistent
