\* Design configuration, document subject (del, duplicate del, ret).  Expected: all invariants hold.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = TRUE
  MaxCatLoss = 1
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
INVARIANTS
  TypeOK
  AckImpliesIntent
  AckedDeleteSurvives
  NoUnackedEffectOnLaterAck
CHECK_DEADLOCK FALSE
