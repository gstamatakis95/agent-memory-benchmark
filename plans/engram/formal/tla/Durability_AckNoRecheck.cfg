\* Experiment (expected to FAIL): the ack path does not re-read the marker after the intent put; a restore between commit and put, replay, and a late put ack a delete that is not in force -> AckedDeleteSurvives (design flaw the model exposed).
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = FALSE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
INVARIANTS
  AckedDeleteSurvives
CHECK_DEADLOCK FALSE
