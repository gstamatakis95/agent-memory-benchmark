\* Must fail (N146, C-3): the catalog is restored from a backup and its replay floor goes back up; replay reads the catalog floor only, so a second restore misses the deletes the first replay re-applied -> AckedDeleteSurvives.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = FALSE
  MaxCatLoss = 1
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
INVARIANTS
  AckedDeleteSurvives
CHECK_DEADLOCK FALSE
