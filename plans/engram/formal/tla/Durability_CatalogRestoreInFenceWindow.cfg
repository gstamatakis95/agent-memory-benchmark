\* Must fail (N182, C8-5): DeleteTenant is acknowledged after the catalog `deleting` row and the tenant intent but
\* before the namespaces are fenced; a catalog restore inside that window reverts the row, the tenant is active again
\* and the acknowledged delete is lost -> AckedDeleteSurvives.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 2
  Lat = 2
  Skew = 0
  Margin = 0
  MaxRestores = 0
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = FALSE
  MaxCatLoss = 1
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
  HelpPrev = FALSE
  TenantAckBeforeFence = TRUE
INVARIANTS
  AckedDeleteSurvives
CHECK_DEADLOCK FALSE
