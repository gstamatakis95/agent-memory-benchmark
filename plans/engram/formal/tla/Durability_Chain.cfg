\* Design configuration, fact subject (inv, res, inv) with host clocks skewed by one tick.  Expected: all invariants hold.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeFact
  MaxT = 7
  Lat = 1
  Skew = 1
  Margin = 2
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  OrderMode = "chain"
INVARIANTS
  TypeOK
  AckImpliesIntent
  AckedDeleteSurvives
  IntentOrderLastWins
  NoUnackedEffectOnLaterAck
CHECK_DEADLOCK FALSE
