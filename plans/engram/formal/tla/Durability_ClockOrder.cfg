\* Must fail (C-16): replay in (deleted_at, id) order with host clocks skewed by one tick -> IntentOrderLastWins.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeFact
  MaxT = 4
  Lat = 1
  Skew = 1
  Margin = 2
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "clock"
INVARIANTS
  IntentOrderLastWins
CHECK_DEADLOCK FALSE
