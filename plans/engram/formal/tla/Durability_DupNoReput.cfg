\* Must fail: a retry that finds the committed marker acks without re-putting its intent (crash between commit and put) -> AckedDeleteSurvives.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = FALSE
  ReplayFirst = TRUE
  FloorMode = "min"
  OrderMode = "chain"
INVARIANTS
  AckedDeleteSurvives
CHECK_DEADLOCK FALSE
