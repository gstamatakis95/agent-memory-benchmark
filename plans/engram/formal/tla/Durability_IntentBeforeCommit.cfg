\* Must fail (C-5): the intent is put before the marker commits, so an orphan intent (failed attempt, concurrent
\* duplicate) is replayed against later state -> NoUnackedEffectOnLaterAck.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = FALSE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = FALSE
  MaxCatLoss = 0
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
  HelpPrev = FALSE
  TenantAckBeforeFence = FALSE
INVARIANTS
  NoUnackedEffectOnLaterAck
CHECK_DEADLOCK FALSE
