\* Must fail: replay ignores the epoch recorded in the intent; the late intent of an op whose commit a restore lost is replayed over a later acknowledged write -> IntentOrderLastWins (design flaw the model exposed).
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeFact
  MaxT = 4
  Lat = 1
  Skew = 1
  Margin = 2
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = FALSE
  OrderMode = "chain"
  BlobFloor = FALSE
  MaxCatLoss = 0
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
  HelpPrev = FALSE
  TenantAckBeforeFence = FALSE
INVARIANTS
  IntentOrderLastWins
CHECK_DEADLOCK FALSE
