\* Must fail (C-4): the replay floor is raised when a replay completes (N134 as first written); a second restore loses the replayed commit and skips the intent -> AckedDeleteSurvives.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "raise"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = FALSE
  MaxCatLoss = 0
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
  HelpPrev = FALSE
INVARIANTS
  AckedDeleteSurvives
CHECK_DEADLOCK FALSE
