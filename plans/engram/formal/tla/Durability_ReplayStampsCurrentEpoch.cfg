\* Must fail (N150, C-7): a replayed marker is stamped with the bumped epoch, so the epoch guard skips the second intent
\* of the subject (the Restore after an Invalidate) -> IntentOrderLastWins.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeFact
  MaxT = 4
  Lat = 1
  Skew = 1
  Margin = 2
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "chain"
  BlobFloor = FALSE
  MaxCatLoss = 0
  ReplayCurrentEpoch = TRUE
  ConcurrentX = TRUE
  SubjectLock = TRUE
  HelpPrev = TRUE
  TenantAckBeforeFence = FALSE
INVARIANTS
  IntentOrderLastWins
CHECK_DEADLOCK FALSE
