\* Must fail: each restore sets the floor to its own target; a second restore while the first replay is pending skips lost intents -> AckedDeleteSurvives.
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeDoc
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "target"
  OrderMode = "chain"
INVARIANTS
  AckedDeleteSurvives
CHECK_DEADLOCK FALSE
