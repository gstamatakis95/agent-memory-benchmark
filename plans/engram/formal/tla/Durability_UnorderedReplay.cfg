\* Must fail: replay in arbitrary order -> AckedDeleteSurvives (Restore overtaken by Invalidate).
SPECIFICATION Spec
CONSTANTS
  MaxOps = 3
  MaxT = 6
  Lat = 1
  Margin = 2
  MaxRestores = 2
  IntentBeforeAck = TRUE
  ReplayFirst = TRUE
  MonotoneFloor = TRUE
  OrderedReplay = FALSE
INVARIANTS
  TypeOK
  AckImpliesIntent
  AckedDeleteSurvives
  RestoreReplaysIntents
CHECK_DEADLOCK FALSE
