  MaxT = 4
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "any"
  BlobFloor = FALSE
  MaxCatLoss = 0
  ReplayCurrentEpoch = FALSE
  ConcurrentX = FALSE
  SubjectLock = TRUE
  HelpPrev = FALSE
  TenantAckBeforeFence = FALSE
INVARIANTS
  IntentOrderLastWins
CHECK_DEADLOCK FALSE
