\* Must fail: replay in arbitrary order -> IntentOrderLastWins (a later Invalidate overtaken by an older Restore).
SPECIFICATION Spec
CONSTANTS
  Shape <- ShapeFact
  MaxT = 7
  Lat = 1
  Skew = 0
  Margin = 1
  MaxRestores = 2
  IntentAfterCommit = TRUE
  AckNeedsIntent = TRUE
  AckRecheck = TRUE
  DupReput = TRUE
  ReplayFirst = TRUE
  FloorMode = "min"
  EpochGuard = TRUE
  OrderMode = "any"
INVARIANTS
  IntentOrderLastWins
CHECK_DEADLOCK FALSE
