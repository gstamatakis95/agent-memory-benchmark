\* Design configuration (liveness): writers run before the freeze and after activation (never under it), with source-side key sweeps, no restore or voluntary abort; every started move completes or rolls back (the window may expire) and no deleted row is resurrected.  Expected: all hold.
SPECIFICATION Spec
CONSTANTS
  NRows = 2
  Clients = {c1, c2}
  Life = 1
  MaxT = 3
  Window = 1
  MaxEp = 4
  MaxRestore = 0
  MaxBak = 0
  MaxFault = 0
  AllowAbort = FALSE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  SeqAdvance = TRUE
  ShardTruth = TRUE
  MaxCat = 0
  MaxMoves = 1
  SqSkew = 2
  CopyBeforeFreeze = FALSE
  ReadyBeforeIndex = FALSE
  CutNeedsReplicated = TRUE
  UnionRepair = FALSE
  BackupBeforeCut = TRUE
  ThawNeedsReplicated = TRUE
  EpochFromAnyRow = FALSE
INVARIANTS
  TypeOK
  SingleWriter
  NoLossNoDup
  NoResurrect
PROPERTIES
  MoveTerminates
CHECK_DEADLOCK FALSE
