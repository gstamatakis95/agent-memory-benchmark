\* Design configuration (liveness): with active writers, source-side sweeps and old-id inserts, and no restore or voluntary abort, every started move completes (done).
SPECIFICATION Spec
CONSTANTS
  NRows = 2
  Clients = {c1, c2}
  Life = 1
  Margin = 1
  MaxT = 3
  MaxEp = 4
  MaxRestore = 0
  MaxBak = 0
  AllowAbort = FALSE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  TimelineCheck = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  IdKeyed = FALSE
  MergeDeletes = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  CleanupNeedsBackup = TRUE
INVARIANTS
  TypeOK
  SingleWriter
  NoLossNoDup
PROPERTIES
  MoveTerminatesActive
CHECK_DEADLOCK FALSE
