\* Must fail (C-21): cleanup deletes the source copy without a post-activation backup of the target; a later restore of the target loses the moved rows -> CleanupSafe.
SPECIFICATION Spec
CONSTANTS
  NRows = 1
  Clients = {c1}
  Life = 1
  Margin = 1
  MaxT = 3
  MaxEp = 4
  MaxRestore = 1
  MaxBak = 0
  AllowAbort = TRUE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  TimelineCheck = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  IdKeyed = FALSE
  MergeDeletes = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  CleanupNeedsBackup = FALSE
SYMMETRY Symm
INVARIANTS
  CleanupSafe
CHECK_DEADLOCK FALSE
