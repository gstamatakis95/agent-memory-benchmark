  Clients = {c1}
  Life = 1
  MaxT = 2
  Window = 1
  MaxEp = 4
  MaxRestore = 0
  MaxBak = 0
  MaxFault = 0
  AllowAbort = TRUE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  ReconcileVerify = TRUE
  FencedSteps = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  SeqAdvance = TRUE
  ShardTruth = TRUE
  MaxCat = 0
  MaxMoves = 1
  SqSkew = 2
  CopyBeforeFreeze = TRUE
  ReadyBeforeIndex = FALSE
  CutNeedsReplicated = TRUE
  UnionRepair = FALSE
  FloorBeforeCut = TRUE
  FailoverChecksFloor = TRUE
  RestoreCloses = TRUE
  EndFromTargetRow = TRUE
  ThawNeedsReplicated = TRUE
  EpochFromAnyRow = FALSE
SYMMETRY Symm
INVARIANTS
  NoLossNoDup
CHECK_DEADLOCK FALSE
