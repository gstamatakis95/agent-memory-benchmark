\* Design, minimal bounds, no symmetry: liveness MoveTerminates under fairness.
\* (1 namespace, 2 API clients, 1 workflow, 2 writes, 1 crash, epochs <= 2, MaxSeq 3.)
SPECIFICATION Spec
CONSTANTS
  Shards = {s1, s2}
  NS = {n1}
  Movable = {n1}
  Clients = {c1, c2}
  Workflows = {w1}
  Writes = {x1, x2}
  MaxEpoch = 2
  MaxMoves = 1
  MaxCrashes = 1
  CopyBarrier = TRUE
  CutoverOrder = "safe"
  NoActor = NoActor
  MaxSeq = 3
INVARIANTS
  NoLossNoDup
  ReadsFresh
  SingleWritableOwner
  WritesOnlyAtOwner
PROPERTIES
  MoveTerminates
