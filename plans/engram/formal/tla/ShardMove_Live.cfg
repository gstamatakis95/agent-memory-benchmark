  NRows = 2
  Clients = {c1, c2}
  Life = 1
  Margin = 1
  MaxT = 2
  MaxEp = 4
  MaxRestore = 1
  MaxBak = 1
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  TimelineCheck = TRUE
  ReconcileVerify = TRUE
