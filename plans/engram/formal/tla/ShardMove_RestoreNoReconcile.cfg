\* Must fail: restore/failover trusts its backup row and bumps the epoch during an open move.
SPECIFICATION Spec
CONSTANTS
  NRows = 3
  Clients = {c1, c2}
  Life = 1
  Margin = 1
  MaxT = 3
  MaxEp = 4
  MaxRestore = 1
  MaxBak = 1
  UseReady = TRUE
  ReconcileOnRestore = FALSE
  TimelineCheck = TRUE
  ReconcileVerify = TRUE
SYMMETRY Symm
INVARIANTS
  TypeOK
  SingleWriter
  NoLossNoDup
  RollbackPossibleBeforeC
  NoRouteToTargetBeforeC
  ZombieCannotCutOver
  RestoreReconciles
CHECK_DEADLOCK FALSE
