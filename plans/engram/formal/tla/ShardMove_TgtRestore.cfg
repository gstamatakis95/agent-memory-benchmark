\* Design configuration, the twin of ShardMove_CleanupTimeGate: after a promotion of the target the cleanup workflow re-copies from the source (ReconcileIn) and the cleanup waits for a backup of the target that contains the moved rows and was taken after the promotion (N149).  Expected: all invariants hold.
