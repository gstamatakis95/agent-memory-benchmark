\* Must fail (changed from D22, where it passed): mover steps do not check the source and target rows they act on; a source restored after Freeze lets the mover finish the copy from reverted data, and recovery completes the committed move -> NoLossNoDup.
SPECIFICATION Spec
CONSTANTS
  NRows = 2
  Clients = {c1, c2}
  Life = 1
  Margin = 1
  MaxT = 2
  MaxEp = 4
  MaxRestore = 1
  MaxBak = 1
  AllowAbort = TRUE
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  TimelineCheck = TRUE
  ReconcileVerify = TRUE
  FencedSteps = FALSE
  IdKeyed = FALSE
  MergeDeletes = TRUE
  SweepPause = TRUE
  StampAfterCut = FALSE
  CleanupNeedsBackup = TRUE
SYMMETRY Symm
INVARIANTS
  NoLossNoDup
CHECK_DEADLOCK FALSE
