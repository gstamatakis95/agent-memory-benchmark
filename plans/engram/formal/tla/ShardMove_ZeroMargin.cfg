\* Experiment (expected to PASS, safety + liveness): zero re-copy margin WITH the count/hash verify. A margin below the
\* writer lifetime can only cost a rollback (Verified blocks (b'), only Rollback stays enabled), never a lost row.
SPECIFICATION Spec
CONSTANTS
  NRows = 2
  Clients = {c1, c2}
  Life = 1
  Margin = 0
  MaxT = 2
  MaxEp = 4
  MaxRestore = 1
  MaxBak = 1
  UseReady = TRUE
  ReconcileOnRestore = TRUE
  TimelineCheck = TRUE
  FencedSteps = TRUE
  ReconcileVerify = TRUE
INVARIANTS
  SingleWriter
  NoLossNoDup
  RollbackPossibleBeforeC
  RestoreReconciles
PROPERTIES
  MoveTerminates
CHECK_DEADLOCK FALSE
