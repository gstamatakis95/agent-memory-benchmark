// engram/internal/workflow/v1/workflow.proto
//
// Temporal payloads (workflow inputs, activity inputs/results). NEVER served
// over gRPC; encoded with the Temporal proto payload converter. Every input
// carries a WorkflowScope with (namespace_id, tenant_id, shard_id, epoch) so
// that workers never consult the catalog on the hot path (decision D4): the
// shard's `namespace_ownership` row verifies the epoch inside every
// activity transaction.
//
// Versioning: package version + `schema_version` on every top-level input.
// Adding fields is always safe (histories replay with defaults); removing or
// re-interpreting a field requires a `workflow.GetVersion` patch in the
// workflow code and a drain window for running histories (section 4.5).
syntax = "proto3";

package engram.internal.workflow.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";

option go_package = "example.com/engram/gen/go/engram/internal/workflow/v1;workflowv1";

// WorkflowScope is the fencing token carried by every payload.
message WorkflowScope {
  string namespace_id = 1;
  string tenant_id = 2;
  int32 shard_id = 3;
  // Ownership epoch the operation was submitted under. Activities abort with
  // FAILED_PRECONDITION + WrongShardOrEpoch when the shard disagrees; the
  // move executor restarts the operation with the new epoch after cutover.
  int64 epoch = 4;
  // Blob key prefix of the shard ("shard-7"), so activities build keys
  // without the catalog.
  string blob_prefix = 5;
}

// ResolvedModels snapshots the model configuration at submission so that a
// workflow is deterministic even if the namespace config changes mid-flight.
message ResolvedModels {
  string extract = 1;
  string summarize = 2;
  string consolidate = 3;
  string reflect = 4;
  string embed = 5;
  string rerank = 6;
  // Prompt versions, e.g. "extract/v1".
  string extract_prompt_version = 7;
  string summarize_prompt_version = 8;
  string consolidate_prompt_version = 9;
  string page_prompt_version = 10;
  // Extraction output schema version, part of the cache key.
  string extract_schema_version = 11;
  // Embedding dimensions actually stored (768, or 512 with Matryoshka).
  int32 embed_dims = 12;
}

// TokenUsage is returned by every LLM-calling activity for metering.
message TokenUsage {
  string model = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  int64 cost_micros = 4;
  // True when the extraction/summary cache answered and no call was made.
  bool cache_hit = 5;
}

// RetainDocumentInput starts workflow `ns/{namespace_id}/op/{operation_id}`
// on task queue `shard-{shard_id}` (decision D11).
message RetainDocumentInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  string document_id = 4;
  // Version being built (previous active version + 1).
  int64 version = 5;
  memory.v1.UpdateMode update_mode = 6;
  // ingest_ledger row ids of the items, in item order. Activities read the
  // raw content from the ledger/blob, never from the payload.
  repeated string ledger_ids = 7;
  // SHA-256 of the canonical RetainRequest, for idempotent resubmission.
  string request_hash = 8;
  google.protobuf.Timestamp submitted_at = 9;
  ResolvedModels models = 10;
  // Chunking target from resolved config.
  int32 chunk_target_chars = 11;
  // Union of item tags, for the outbox event.
  repeated string tags = 12;
}

// ChunkWork is one chunk to process (fan-out unit, ≤ 32 in flight).
message ChunkWork {
  string document_id = 1;
  int64 version = 2;
  // Hex SHA-256 of `text`: the chunk identity within the document.
  string content_hash = 3;
  int32 ordinal = 4;
  // Chunk text (≤ 8 KiB).
  string text = 5;
  // "[doc summary] > [heading path]" header prepended for embedding and
  // extraction.
  string header = 6;
  // Offsets into the concatenated item content and the originating item.
  int32 char_start = 7;
  int32 char_end = 8;
  int32 item_index = 9;
  // Per-item values inherited by the chunk's facts.
  google.protobuf.Timestamp mentioned_at = 10;
  repeated string tags = 11;
  // Serialised google.protobuf.Struct (JSON) of the item metadata.
  bytes metadata_json = 12;
  repeated memory.v1.EntityHint entity_hints = 13;
  string context = 14;
}

// ChunkPlan is the result of the Chunk activity: the delta against the
// previous version by content hash (decision D8).
message ChunkPlan {
  // Chunks that need extraction (new hashes).
  repeated ChunkWork new_chunks = 1;
  // Hashes kept from the previous version without work.
  repeated string unchanged_hashes = 2;
  // Retired-but-not-purged hashes to un-retire.
  repeated string unretired_hashes = 3;
  // Hashes of the previous version absent from the new one (REPLACE only):
  // retired by FinalizeVersion.
  repeated string retired_hashes = 4;
  // Content hash of the whole version.
  string version_hash = 5;
}

// SummarizeDocumentResult is the document summary used in chunk headers.
message SummarizeDocumentResult {
  // ≤ 200 chars.
  string summary = 1;
  TokenUsage usage = 2;
}

// CausalRelation links two facts of the same chunk by index.
message CausalRelation {
  int32 cause_index = 1;
  int32 effect_index = 2;
  // Extractor confidence in [0, 1].
  float confidence = 3;
}

// EntityMention is an entity as written in a fact.
message EntityMention {
  string mention = 1;
  string type = 2;
  // Populated by ResolveEntities.
  string entity_id = 3;
  string canonical_name = 4;
  bool created = 5;
}

// ExtractedFact is one fact from the extractor (pre-commit; no id yet).
message ExtractedFact {
  int32 index = 1;
  string text = 2;
  memory.v1.FactType fact_type = 3;
  string who = 4;
  string what = 5;
  string when = 6;
  string where = 7;
  string why = 8;
  memory.v1.TemporalWindow occurred = 9;
  // Defaults to the chunk's mentioned_at unless the extractor found an
  // explicit "as said on" date.
  google.protobuf.Timestamp mentioned_at = 10;
  repeated EntityMention entities = 11;
  // Extractor confidence in [0, 1]; the pipeline section owns the drop
  // threshold.
  float confidence = 12;
}

// ExtractChunkResult is the structured extraction of one chunk.
message ExtractChunkResult {
  string content_hash = 1;
  repeated ExtractedFact facts = 2;
  repeated CausalRelation causal = 3;
  TokenUsage usage = 4;
  // Blob key of the cache entry that answered or was written.
  string cache_key = 5;
}

// Embedding is one L2-normalised vector as little-endian float32 bytes
// (dims × 4 bytes). Kept in the payload (≤ 3 KiB each; a chunk with 50
// facts is ≈ 150 KiB, well under Temporal's 2 MiB limit); when the total
// exceeds 512 KiB the activity spills to `staging_blob_key` instead.
message Embedding {
  // -1 for the chunk itself, else the fact index.
  int32 fact_index = 1;
  bytes vector = 2;
}

// EmbedChunkResult holds embeddings for the chunk and its facts.
message EmbedChunkResult {
  string content_hash = 1;
  repeated Embedding embeddings = 2;
  // Set instead of `embeddings` when spilled.
  string staging_blob_key = 3;
  string model = 4;
  int32 dims = 5;
}

// ResolveEntitiesResult maps mentions to entity ids (fuzzy, per namespace).
message ResolveEntitiesResult {
  string content_hash = 1;
  // One per (fact index, mention index), resolved.
  repeated EntityMention resolved = 2;
  int32 entities_created = 3;
}

// LinkType enumerates fact_links kinds.
enum LinkType {
  LINK_TYPE_UNSPECIFIED = 0;
  LINK_TYPE_ENTITY = 1;
  LINK_TYPE_TEMPORAL = 2;
  LINK_TYPE_SEMANTIC = 3;
  LINK_TYPE_CAUSAL = 4;
}

// FactLink is one link to build in CommitChunk.
message FactLink {
  // Source fact index within the chunk.
  int32 src_index = 1;
  // Either an existing fact id or an index within the chunk (dst_index ≥ 0).
  string dst_fact_id = 2;
  int32 dst_index = 3;
  LinkType type = 4;
  float weight = 5;
}

// BuildLinksResult is the link set for one chunk (temporal ≤ 20 per fact,
// semantic kNN ≤ 10, entity, causal).
message BuildLinksResult {
  string content_hash = 1;
  repeated FactLink links = 2;
}

// CommitChunkInput is everything CommitChunk writes in ONE transaction:
// chunk row, facts, embeddings, mentions, links and the outbox event.
message CommitChunkInput {
  WorkflowScope scope = 1;
  string operation_id = 2;
  ChunkWork chunk = 3;
  ExtractChunkResult extraction = 4;
  EmbedChunkResult embeddings = 5;
  ResolveEntitiesResult entities = 6;
  BuildLinksResult links = 7;
  // sha256(namespace_id ‖ document_id ‖ version ‖ content_hash). The epoch
  // is deliberately NOT part of the identity: after a move cutover the
  // operation restarts at epoch e+1 on the target, where the chunks already
  // committed at epoch e were copied, and CommitChunk must recognise them as
  // done. The epoch is a fence (checked against namespace_ownership inside
  // the transaction), not an identity component.
  string idempotency_key = 8;
}

// CommitChunkResult reports the committed ids.
message CommitChunkResult {
  string chunk_id = 1;
  repeated string fact_ids = 2;
  int32 links_written = 3;
  // True when the idempotency key already existed (retry after commit).
  bool already_committed = 4;
  // Outbox sequence of the ChunkCommitted event.
  int64 outbox_seq = 5;
}

// FinalizeVersionInput retires missing chunks and activates the version.
message FinalizeVersionInput {
  WorkflowScope scope = 1;
  string operation_id = 2;
  string document_id = 3;
  int64 version = 4;
  repeated string retired_hashes = 5;
  repeated string unretired_hashes = 6;
  string version_hash = 7;
}

// FinalizeVersionResult reports what FinalizeVersion did.
message FinalizeVersionResult {
  int32 chunks_retired = 1;
  int32 facts_retired = 2;
  int32 chunks_unretired = 3;
  int64 outbox_seq = 4;
}

// ConsolidateTrigger is the SignalWithStart payload of the per-namespace
// Consolidate workflow (id `ns/{namespace_id}/consolidate`, debounced 30 s).
message ConsolidateTrigger {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  ConsolidateReason reason = 3;
  // Facts that changed, as a hint for batch selection (may be empty).
  repeated string fact_ids = 4;
  google.protobuf.Timestamp triggered_at = 5;
}

// ConsolidateReason says what woke consolidation.
enum ConsolidateReason {
  CONSOLIDATE_REASON_UNSPECIFIED = 0;
  CONSOLIDATE_REASON_RETAIN = 1;
  CONSOLIDATE_REASON_DELETE = 2;
  CONSOLIDATE_REASON_INVALIDATE = 3;
  CONSOLIDATE_REASON_MANUAL = 4;
  CONSOLIDATE_REASON_SCHEDULE = 5;
}

// ConsolidateInput is the Consolidate workflow's own input (first start).
message ConsolidateInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  ResolvedModels models = 3;
  // ≤ 100 facts per round, 8 per LLM call (decision D12).
  int32 max_facts_per_round = 4;
  int32 facts_per_call = 5;
}

// ConsolidateBatchInput is one LLM call's worth of facts plus candidate
// observations (top-10 by similarity).
message ConsolidateBatchInput {
  WorkflowScope scope = 1;
  // sha256(sorted fact ids ‖ prompt_version ‖ model).
  string batch_key = 2;
  repeated string fact_ids = 3;
  repeated string candidate_observation_ids = 4;
  ResolvedModels models = 5;
  // Bisect depth (0 = full batch of 8, 1 = 4, 2 = 2, 3 = 1).
  int32 bisect_level = 6;
}

// ObservationOpKind is the consolidation operation type.
enum ObservationOpKind {
  OBSERVATION_OP_KIND_UNSPECIFIED = 0;
  OBSERVATION_OP_KIND_CREATE = 1;
  OBSERVATION_OP_KIND_UPDATE = 2;
  OBSERVATION_OP_KIND_DELETE = 3;
}

// ObservationOp is one consolidation edit, idempotent by op_key.
message ObservationOp {
  // sha256(batch_key ‖ op_index); recorded in consolidation_applied.
  string op_key = 1;
  ObservationOpKind kind = 2;
  // Empty for CREATE.
  string observation_id = 3;
  string text = 4;
  repeated string source_fact_ids = 5;
  repeated string quotes = 6;
}

// ConsolidateBatchResult is the applied outcome of one batch.
message ConsolidateBatchResult {
  string batch_key = 1;
  repeated ObservationOp ops = 2;
  int32 ops_applied = 3;
  int32 ops_skipped_already_applied = 4;
  TokenUsage usage = 5;
  // True when the batch failed and was split.
  bool bisected = 6;
  // Facts that could not be consolidated even at bisect level 3.
  repeated string failed_fact_ids = 7;
}

// RefreshPageInput starts a page refresh workflow.
message RefreshPageInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  string page_id = 4;
  RefreshReason reason = 5;
  // Version the delta edit starts from (0 = full write).
  int64 base_version = 6;
  ResolvedModels models = 7;
  bool force_full_rewrite = 8;
}

// RefreshReason says why a page refresh runs.
enum RefreshReason {
  REFRESH_REASON_UNSPECIFIED = 0;
  REFRESH_REASON_WRITE = 1;
  REFRESH_REASON_DELETE = 2;
  REFRESH_REASON_SCHEDULE = 3;
  REFRESH_REASON_MANUAL = 4;
  REFRESH_REASON_CREATE = 5;
}

// RefreshPageResult reports the new version.
message RefreshPageResult {
  int64 version = 1;
  string markdown_blob_key = 2;
  google.protobuf.Timestamp effective_at = 3;
  int32 sources_added = 4;
  int32 sources_removed = 5;
  TokenUsage usage = 6;
}

// PurgeTarget selects what a purge removes.
enum PurgeTarget {
  PURGE_TARGET_UNSPECIFIED = 0;
  // Everything of one document (explicit delete; grace 0).
  PURGE_TARGET_DOCUMENT = 1;
  // Everything of the namespace on this shard.
  PURGE_TARGET_NAMESPACE = 2;
  // Retired rows older than `grace` across the namespace (grace 1 h).
  PURGE_TARGET_RETIRED_SWEEP = 3;
  // Rows left on a move source after the 24 h grace.
  PURGE_TARGET_MOVED_OUT = 4;
}

// PurgeInput starts the PurgeWorkflow.
message PurgeInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  PurgeTarget target = 4;
  string document_id = 5;
  // Versions to purge (empty = all versions of the document).
  repeated int64 versions = 6;
  google.protobuf.Duration grace = 7;
  // Rows per delete batch (default 10 000).
  int32 batch_size = 8;
}

// PurgeResult reports counts.
message PurgeResult {
  int64 rows_purged = 1;
  int64 blobs_purged = 2;
  int32 batches = 3;
}

// ExportInput starts a snapshot workflow.
message ExportInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  int64 version = 4;
  // Previous version for the delta file (0 = none).
  int64 base_version = 5;
  bool include_chunks = 6;
  bool include_pages = 7;
  // Outbox positions bounding the delta.
  int64 base_outbox_seq = 8;
  int64 outbox_seq = 9;
}

// ExportResult reports the written files.
message ExportResult {
  int64 version = 1;
  string manifest_blob_key = 2;
  int64 total_bytes = 3;
  bool delta_written = 4;
}

// MoveInput starts the move executor workflow (`move/{namespace_id}/{epoch}`)
// on the TARGET shard's task queue (`shard-{target_shard_id}`, register N2).
// The executing worker opens a second, move-scoped pool to the source shard
// (role `engram_move`); it is the only code path that holds two shard handles.
message MoveInput {
  uint32 schema_version = 1;
  string move_id = 2;
  string namespace_id = 3;
  string tenant_id = 4;
  int32 source_shard_id = 5;
  int32 target_shard_id = 6;
  int64 source_epoch = 7;
  int64 target_epoch = 8;
  string source_blob_prefix = 9;
  string target_blob_prefix = 10;
  bool pause_before_freeze = 11;
}

// MoveCheckpoint is persisted after every step so the executor is
// restartable (decision D5 states).
message MoveCheckpoint {
  string state = 1;
  int64 copy_start_seq = 2;
  int64 applied_seq = 3;
  repeated string tables_done = 4;
  repeated string terminated_operation_ids = 5;
  google.protobuf.Timestamp frozen_at = 6;
}

// MoveResult is the terminal outcome.
message MoveResult {
  string final_state = 1;
  int64 rows_copied = 2;
  int64 events_replayed = 3;
  repeated string restarted_operation_ids = 4;
  string error = 5;
}
