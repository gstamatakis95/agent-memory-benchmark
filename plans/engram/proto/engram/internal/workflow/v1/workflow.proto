// engram/internal/workflow/v1/workflow.proto
//
// Temporal payloads (workflow inputs, activity inputs/results). NEVER served
// over gRPC; encoded with the Temporal proto payload converter. Every input
// carries a WorkflowScope with (namespace_id, tenant_id, shard_id, epoch) so
// that workers never consult the catalog on the hot path (decision D4): the
// shard's `namespace_ownership` row verifies the epoch inside every
// activity transaction.
//
// Versioning: package version + `schema_version` on every top-level input.
// Adding fields is always safe (histories replay with defaults); removing or
// re-interpreting a field requires a `workflow.GetVersion` patch in the
// workflow code and a drain window for running histories (section 4.5).
//
// Payload size and confidentiality (decision N59, review F-13/F-18/F-25):
//   * every activity result larger than 4 KiB travels by blob key under the
//     namespace prefix (extraction, embeddings, entity resolution, links);
//     CommitChunkInput is keys-only, so a Temporal history holds ids, hashes
//     and keys — never fact text or vectors — and a document delete reaches
//     it by deleting the blobs;
//   * RetainDocument continues-as-new every 100 chunks or 20 MB of history;
//   * whatever still travels inline is encrypted at rest by a Temporal
//     DataConverter payload codec (AES-256-GCM). Decision N99 (review-2
//     G-20): the codec uses a PER-NAMESPACE data key wrapped by the shard key
//     (key id in the payload metadata, namespace id in the workflow header);
//     deleting the wrapped data key is the shredding step of a namespace or
//     tenant delete, and a key version is destroyed only after rotation time
//     + max workflow run timeout (7 d) + Temporal retention (7 d). The
//     accurate statement is therefore: text appears in histories only as
//     ciphertext, at most 4 KiB per activity result, plus
//     ChunkWork.header/context/metadata_json/entity_hints; histories expire
//     with retention 7 d and are unreadable after key destruction.
syntax = "proto3";

package engram.internal.workflow.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";

option go_package = "example.com/engram/gen/go/engram/internal/workflow/v1;workflowv1";

// WorkflowScope is the fencing token carried by every payload.
message WorkflowScope {
  string namespace_id = 1;
  string tenant_id = 2;
  int32 shard_id = 3;
  // Ownership epoch the operation was submitted under. Activities abort with
  // FAILED_PRECONDITION + WrongShardOrEpoch when the shard disagrees; the
  // move executor restarts the operation with the new epoch after cutover.
  int64 epoch = 4;
  // Blob key prefix of the shard (= shard_id as text, "7"), so activities
  // build keys without the catalog.
  string blob_prefix = 5;
}

// ResolvedModels snapshots the model configuration at submission so that a
// workflow is deterministic even if the namespace config changes mid-flight.
message ResolvedModels {
  string extract = 1;
  string summarize = 2;
  string consolidate = 3;
  string reflect = 4;
  string embed = 5;
  string rerank = 6;
  // Prompt versions, e.g. "extract/v1".
  string extract_prompt_version = 7;
  string summarize_prompt_version = 8;
  string consolidate_prompt_version = 9;
  string page_prompt_version = 10;
  // Extraction output schema version, part of the cache key.
  string extract_schema_version = 11;
  // Embedding dimensions actually stored (768, or 512 with Matryoshka).
  int32 embed_dims = 12;
}

// TokenUsage is returned by every LLM-calling activity for metering.
message TokenUsage {
  string model = 1;
  int64 prompt_tokens = 2;
  int64 completion_tokens = 3;
  int64 cost_micros = 4;
  // True when the extraction/summary cache answered and no call was made.
  bool cache_hit = 5;
}

// RetainDocumentInput starts workflow `ns/{namespace_id}/op/{operation_id}`
// on task queue `shard-{shard_id}` (decision D11).
message RetainDocumentInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  string document_id = 4;
  // Version being built (previous active version + 1).
  int64 version = 5;
  memory.v1.UpdateMode update_mode = 6;
  // ingest_ledger row ids of the items, in item order. Activities read the
  // raw content from the ledger/blob, never from the payload.
  repeated string ledger_ids = 7;
  // SHA-256 of the canonical RetainRequest, for idempotent resubmission.
  string request_hash = 8;
  google.protobuf.Timestamp submitted_at = 9;
  ResolvedModels models = 10;
  // Chunking target from resolved config.
  int32 chunk_target_chars = 11;
  // Union of item tags, for the outbox event.
  repeated string tags = 12;
  // Set only on a continue-as-new run (every 100 chunks or 20 MB of history,
  // decision N59): where the previous run stopped.
  RetainResume resume = 13;
  // `retain.mission` from the submit-time config_snapshot (N25), a prompt
  // input of extract/v1. It is folded into every chunk's render_hash (N87).
  string retain_mission = 14;
}

// RetainResume is the continue-as-new state of RetainDocument. Everything
// else the new run needs is durable per chunk (document_version_chunks) or
// re-derivable from the manifest blob.
message RetainResume {
  // Index of the next manifest entry to process.
  int32 next_chunk = 1;
  // Blob key of the chunk manifest written by the Chunk activity.
  string manifest_blob_key = 2;
  // Summary id in use for chunk headers (decision N60: recomputed only on
  // REPLACE or > 25 % growth, so a continued run never re-summarises).
  string summary_id = 3;
  int32 chunks_done = 4;
  int32 chunks_failed = 5;
  int32 chunks_reused = 6;
  int32 facts_written = 7;
  // Blob key of the full reconstructed body of the version being built
  // (`{prefix}/ver/{sha256}`, decision N104), so a continued run never
  // re-reads the ledger chain.
  string body_blob_key = 8;
}

// LoadItemResult is the result of the LoadItem activity (decision N56, N104).
message LoadItemResult {
  // APPEND: the version this one extends (the highest existing version below
  // `version`, even one still ingesting); 0 for REPLACE.
  int64 append_base_version = 1;
  // Content-addressed blob `{prefix}/ver/{sha256}` holding the FULL
  // reconstructed body of this version, written by LoadItem before the
  // version row is finalised (decision N104): the next APPEND reads this
  // single object instead of walking the ledger chain. Mirrors
  // document_versions.body_key / body_hash.
  string body_blob_key = 2;
  string body_hash = 3;
  // Bytes of the reconstructed body.
  int64 document_bytes = 4;
  // Items whose timestamp was clamped up to the running maximum (N86).
  int32 timestamps_clamped = 5;
}

// ChunkWork is one chunk to process (fan-out unit, ≤ 32 in flight). It
// carries no chunk text: activities read it from the manifest blob written by
// the Chunk activity (`manifest_blob_key`, entry `ordinal`), so an activity
// input in the Temporal history is a few hundred bytes (decision N59).
message ChunkWork {
  string document_id = 1;
  int64 version = 2;
  // Hex SHA-256 of the chunk text: the chunk identity within the document.
  string content_hash = 3;
  int32 ordinal = 4;
  // "[doc summary] > [heading path]" header prepended for embedding the CHUNK
  // vector and for extraction. Fact vectors are embedded without it
  // (decision N60), so a summary change re-embeds chunks only.
  string header = 6;
  // Offsets into the concatenated item content.
  int32 char_start = 7;
  int32 char_end = 8;
  // Per-item values inherited by the chunk's facts. mentioned_at is the
  // maximum `timestamp` of every item whose bytes the chunk covers (for an
  // APPEND re-chunk also the mentioned_at of every base chunk the new text
  // overlaps), server-set, the only as_of key (decisions D9, N86). It is also
  // the `item_timestamp` the extraction prompt sees; a hard chunk boundary is
  // forced between consecutive items more than 24 h apart, which bounds the
  // relative-date error.
  google.protobuf.Timestamp mentioned_at = 10;
  repeated string tags = 11;
  // Serialised google.protobuf.Struct (JSON) of the item metadata.
  bytes metadata_json = 12;
  repeated memory.v1.EntityHint entity_hints = 13;
  string context = 14;
  // Manifest blob holding the chunk text (`{prefix}/manifests/{operation_id}.json`).
  string manifest_blob_key = 15;
  // sha256(content_hash ‖ heading path ‖ summary id) — decision N60: the
  // header hash compared at FinalizeVersion to decide chunk re-embedding.
  string header_hash = 16;
  // Indexes of every item whose bytes the chunk covers, ascending (decision
  // N86; replaces the singular item_index).
  repeated int32 item_indexes = 17;
  // sha256(day(mentioned_at) ‖ context ‖ canonical(metadata) ‖
  // sorted(entity_hints) ‖ retain.mission ‖ header_hash) — decision N87. The
  // extraction cache key and chunks.extraction_key are
  // sha256(content_hash ‖ prompt_version ‖ model ‖ schema_version ‖
  // render_hash), so a change to any prompt input is a new key.
  string render_hash = 18;

  // Removed in v1.0.0-rc5 (decision N59): `string text = 5` (≤ 8 KiB of chunk
  // text inline in every activity input). Read from the manifest blob instead.
  reserved 5;
  reserved "text";
  // Removed in N86: `int32 item_index = 9` (a chunk may cover several items).
  reserved 9;
  reserved "item_index";
}

// ChunkPlan is the result of the Chunk activity: the delta against the
// previous version by content hash (decision D8).
message ChunkPlan {
  // Chunks that need extraction (new hashes).
  repeated ChunkWork new_chunks = 1;
  // Hashes kept from the previous version without work.
  repeated string unchanged_hashes = 2;
  // Retired-but-not-purged hashes to un-retire.
  repeated string unretired_hashes = 3;
  // Hashes of the previous version absent from the new one (REPLACE only):
  // retired by FinalizeVersion.
  repeated string retired_hashes = 4;
  // Content hash of the whole version.
  string version_hash = 5;
}

// SummarizeDocumentResult is the document summary used in chunk headers.
message SummarizeDocumentResult {
  // ≤ 200 chars.
  string summary = 1;
  TokenUsage usage = 2;
}

// CausalRelation links two facts of the same chunk by index.
message CausalRelation {
  int32 cause_index = 1;
  int32 effect_index = 2;
  // Extractor confidence in [0, 1].
  float confidence = 3;
}

// EntityMention is an entity as written in a fact.
message EntityMention {
  string mention = 1;
  string type = 2;
  // Populated by ResolveEntities.
  string entity_id = 3;
  string canonical_name = 4;
  bool created = 5;
}

// ExtractedFact is one fact from the extractor (pre-commit; no id yet).
message ExtractedFact {
  int32 index = 1;
  string text = 2;
  memory.v1.FactType fact_type = 3;
  string who = 4;
  string what = 5;
  string when = 6;
  string where = 7;
  string why = 8;
  memory.v1.TemporalWindow occurred = 9;
  // Always the chunk's mentioned_at (= item timestamp), copied by the
  // activity; the extractor cannot set or move it (decision D9, review F-2).
  google.protobuf.Timestamp mentioned_at = 10;
  repeated EntityMention entities = 11;
  // Extractor confidence in [0, 1]; the pipeline section owns the drop
  // threshold.
  float confidence = 12;
  // The extractor's "as said on" date when the chunk quotes or forwards older
  // material; display and ranking only, never a visibility key (D9).
  google.protobuf.Timestamp said_at = 13;
}

// ExtractChunkResult is the structured extraction of one chunk. The facts
// live in the extraction-cache blob (`cache_key`), which is also the result
// blob: `facts`/`causal` are populated inline only when the whole result is
// ≤ 4 KiB (decision N59); otherwise they are empty and CommitChunk reads the
// blob. Either way the history never carries more than 4 KiB of text.
message ExtractChunkResult {
  string content_hash = 1;
  repeated ExtractedFact facts = 2;
  repeated CausalRelation causal = 3;
  TokenUsage usage = 4;
  // Blob key of the cache entry that answered or was written; the
  // authoritative result when `facts` is empty. The key is
  // `{prefix}/xcache/{sha256(content_hash ‖ prompt_version ‖ model ‖
  // schema_version ‖ render_hash)}.json` (decision N87). A cache entry is
  // deleted by PurgeDocument only when no live chunk references the hash AND
  // it is older than xcache_grace (24 h, N100).
  string cache_key = 5;
  // Number of facts in the result (so the workflow can plan without reading
  // the blob).
  int32 fact_count = 6;
  // Set with `reason` when extraction failed permanently (the chunk text is
  // still stored and searchable through the chunk arm).
  bool chunk_failed = 7;
  string failure_reason = 8;
}

// Embedding is one L2-normalised vector as little-endian float32 bytes
// (dims × 4 bytes, 3 KiB at 768-d). Kept inline only when the whole result is
// ≤ 4 KiB — in practice a chunk with no facts; every other result is written
// to `staging_blob_key` and the history carries the key (decision N59; the
// earlier 512 KiB spill threshold let ≈ 400 KiB per chunk into the history).
message Embedding {
  // -1 for the chunk itself, else the fact index.
  int32 fact_index = 1;
  bytes vector = 2;
}

// EmbedChunkResult holds embeddings for the chunk and its facts.
message EmbedChunkResult {
  string content_hash = 1;
  repeated Embedding embeddings = 2;
  // `{prefix}/staging/{sha256(idempotency key)}.f32`; set instead of
  // `embeddings` whenever the result exceeds 4 KiB (N59).
  string staging_blob_key = 3;
  string model = 4;
  int32 dims = 5;
  // Hash of the header the chunk vector was embedded with (N60).
  string header_hash = 6;
}

// ResolveEntitiesResult maps mentions to entity ids (fuzzy, per namespace).
message ResolveEntitiesResult {
  string content_hash = 1;
  // One per (fact index, mention index), resolved. Inline only when ≤ 4 KiB,
  // else empty and stored at `result_blob_key` (N59).
  repeated EntityMention resolved = 2;
  int32 entities_created = 3;
  string result_blob_key = 4;
}

// LinkType enumerates fact_links kinds.
enum LinkType {
  LINK_TYPE_UNSPECIFIED = 0;
  LINK_TYPE_ENTITY = 1;
  LINK_TYPE_TEMPORAL = 2;
  LINK_TYPE_SEMANTIC = 3;
  LINK_TYPE_CAUSAL = 4;
}

// FactLink is one link to build in CommitChunk.
message FactLink {
  // Source fact index within the chunk.
  int32 src_index = 1;
  // Either an existing fact id or an index within the chunk (dst_index ≥ 0).
  string dst_fact_id = 2;
  int32 dst_index = 3;
  LinkType type = 4;
  float weight = 5;
}

// BuildLinksResult is the link set for one chunk (temporal ≤ 20 per fact,
// semantic kNN ≤ 10, entity, causal; ≤ 60 per fact).
message BuildLinksResult {
  string content_hash = 1;
  // Inline only when ≤ 4 KiB, else empty and stored at `result_blob_key`
  // (N59; 50 facts × 60 links is ≈ 150 KiB).
  repeated FactLink links = 2;
  string result_blob_key = 3;
  int32 link_count = 4;
}

// CommitChunkInput is everything CommitChunk writes in ONE transaction. A
// missing input blob (purged by a concurrent PurgeDocument) fails the
// activity with the retryable InputBlobMissing error (memory.v1, decision
// N100): the chunk sub-pipeline re-runs ExtractChunk and EmbedChunk, at most
// twice, then records chunk_failed. A shared per-document advisory lock that
// cannot be taken fails it with the retryable DocumentBusy (N83).
// chunk row, facts, embeddings, mentions, links and the outbox event. It is
// KEYS-ONLY (decision N59): the activity reads extraction, embeddings,
// resolved entities and links from the blob keys below, so the history does
// not repeat ≈ 400 KiB per chunk and a document delete can erase every copy
// of the text by deleting blobs.
message CommitChunkInput {
  WorkflowScope scope = 1;
  string operation_id = 2;
  ChunkWork chunk = 3;
  // sha256(namespace_id ‖ document_id ‖ version ‖ content_hash). The epoch
  // is deliberately NOT part of the identity: after a move cutover the
  // operation restarts at epoch e+1 on the target, where the chunks already
  // committed at epoch e were copied, and CommitChunk must recognise them as
  // done. The epoch is a fence (checked against namespace_ownership inside
  // the transaction), not an identity component.
  string idempotency_key = 8;
  // Extraction-cache blob holding the facts (ExtractChunkResult.cache_key).
  string extraction_blob_key = 9;
  // Staging blob holding the vectors (EmbedChunkResult.staging_blob_key).
  string embeddings_blob_key = 10;
  // ResolveEntitiesResult.result_blob_key.
  string entities_blob_key = 11;
  // BuildLinksResult.result_blob_key.
  string links_blob_key = 12;
  // Usage of the extract and embed calls, folded into token_usage_events in
  // the same transaction (PD-1).
  repeated TokenUsage usage = 13;

  // Removed in v1.0.0-rc5 (decision N59): the inline copies
  // `ExtractChunkResult extraction = 4`, `EmbedChunkResult embeddings = 5`,
  // `ResolveEntitiesResult entities = 6`, `BuildLinksResult links = 7`.
  reserved 4 to 7;
  reserved "extraction", "embeddings", "entities", "links";
}

// CommitChunkResult reports the committed ids.
message CommitChunkResult {
  string chunk_id = 1;
  repeated string fact_ids = 2;
  int32 links_written = 3;
  // True when the idempotency key already existed (retry after commit).
  bool already_committed = 4;
  // Outbox sequence of the ChunkCommitted event.
  int64 outbox_seq = 5;
}

// FinalizeVersionInput retires missing chunks and activates the version. The
// retire subquery is document-scoped (decision N107):
// `content_hash NOT IN (SELECT content_hash FROM document_version_chunks
// WHERE namespace_id = $1 AND document_id = $2 AND version = $3)`.
message FinalizeVersionInput {
  WorkflowScope scope = 1;
  string operation_id = 2;
  string document_id = 3;
  int64 version = 4;
  repeated string retired_hashes = 5;
  repeated string unretired_hashes = 6;
  string version_hash = 7;
}

// FinalizeVersionResult reports what FinalizeVersion did.
message FinalizeVersionResult {
  int32 chunks_retired = 1;
  int32 facts_retired = 2;
  int32 chunks_unretired = 3;
  int64 outbox_seq = 4;
  // Live facts of kept chunks whose extraction_key differed from the chunk's
  // current key, retired by this finalize (decision N58: a prompt or model
  // bump never leaves two live fact sets on a chunk).
  int32 stale_extraction_facts_retired = 5;
  // Content hashes whose header_hash changed and need chunk re-embedding
  // (N60: chunk vectors only).
  repeated string reembed_hashes = 6;
  // Set when a newer version had already started (N40): this version was
  // marked superseded and retired nothing.
  int64 superseded_by = 7;
}

// ConsolidateTrigger is the SignalWithStart payload of the per-namespace
// Consolidate workflow (id `ns/{namespace_id}/consolidate`, debounced 30 s).
message ConsolidateTrigger {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  ConsolidateReason reason = 3;
  // Facts that changed, as a hint for batch selection (may be empty).
  repeated string fact_ids = 4;
  google.protobuf.Timestamp triggered_at = 5;
}

// ConsolidateReason says what woke consolidation.
enum ConsolidateReason {
  CONSOLIDATE_REASON_UNSPECIFIED = 0;
  CONSOLIDATE_REASON_RETAIN = 1;
  CONSOLIDATE_REASON_DELETE = 2;
  CONSOLIDATE_REASON_INVALIDATE = 3;
  CONSOLIDATE_REASON_MANUAL = 4;
  CONSOLIDATE_REASON_SCHEDULE = 5;
}

// ConsolidateInput is the Consolidate workflow's own input (first start).
message ConsolidateInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  ResolvedModels models = 3;
  // ≤ 100 facts per round, 8 per LLM call (decision D12).
  int32 max_facts_per_round = 4;
  int32 facts_per_call = 5;
}

// ConsolidateBatchInput is one LLM call's worth of facts plus candidate
// observations (top-10 by similarity).
message ConsolidateBatchInput {
  WorkflowScope scope = 1;
  // sha256(sorted fact ids ‖ prompt_version ‖ model).
  string batch_key = 2;
  repeated string fact_ids = 3;
  repeated string candidate_observation_ids = 4;
  ResolvedModels models = 5;
  // Bisect depth (0 = full batch of 8, 1 = 4, 2 = 2, 3 = 1).
  int32 bisect_level = 6;
}

// ObservationOpKind is the consolidation operation type.
enum ObservationOpKind {
  OBSERVATION_OP_KIND_UNSPECIFIED = 0;
  OBSERVATION_OP_KIND_CREATE = 1;
  OBSERVATION_OP_KIND_UPDATE = 2;
  OBSERVATION_OP_KIND_DELETE = 3;
}

// ObservationOp is one consolidation edit, idempotent by op_key.
message ObservationOp {
  // sha256(batch_key ‖ op_index); recorded in consolidation_applied.
  string op_key = 1;
  ObservationOpKind kind = 2;
  // Empty for CREATE.
  string observation_id = 3;
  string text = 4;
  repeated string source_fact_ids = 5;
  repeated string quotes = 6;
}

// ConsolidateBatchResult is the applied outcome of one batch.
message ConsolidateBatchResult {
  string batch_key = 1;
  repeated ObservationOp ops = 2;
  int32 ops_applied = 3;
  int32 ops_skipped_already_applied = 4;
  TokenUsage usage = 5;
  // True when the batch failed and was split.
  bool bisected = 6;
  // Facts that could not be consolidated even at bisect level 3.
  repeated string failed_fact_ids = 7;
}

// ObservationVersionRef names one observation version shown to a consolidation
// prompt (a candidate_versions entry, decision N79).
message ObservationVersionRef {
  string observation_id = 1;
  int64 version = 2;
}

// StoreProposalInput persists the validated, deduplicated op list write-once
// (decision N43). `candidate_versions` is every candidate version whose text
// was shown, including the observation's own previous version; ApplyBatch
// records one observation_version_lineage edge per entry and re-verifies each
// one (decision N79).
message StoreProposalInput {
  WorkflowScope scope = 1;
  // Hex sha256(sorted fact ids ‖ prompt_version ‖ model).
  string batch_key = 2;
  repeated ObservationOp ops = 3;
  // The rendered evidence: batch facts ∪ the quoted sources shown (≤ 5 per
  // candidate, N47).
  repeated string input_fact_ids = 4;
  repeated ObservationVersionRef candidate_versions = 5;
  string prompt_version = 6;
  string model = 7;
}

// StoreProposalResult returns the list that won (the stored one).
message StoreProposalResult {
  // False when an earlier attempt had already stored a proposal: `ops` is
  // then that attempt's list and this attempt's ops were discarded.
  bool stored_new = 1;
  repeated ObservationOp ops = 2;
}

// ApplyBatchInput applies the STORED proposal of a batch.
message ApplyBatchInput {
  WorkflowScope scope = 1;
  string batch_key = 2;
}

// ApplyOutcome is how ApplyBatch ended.
enum ApplyOutcome {
  APPLY_OUTCOME_UNSPECIFIED = 0;
  APPLY_OUTCOME_APPLIED = 1;
  // Every op_key already existed: an earlier attempt committed.
  APPLY_OUTCOME_ALREADY = 2;
  // Re-verification failed (N41, N79): a rendered input fact is not live, or
  // a shown candidate version is derived_from_deleted, hidden_by_invalidation
  // > 0 or retired. The proposal was deleted in its separate transaction.
  APPLY_OUTCOME_DISCARDED = 3;
  // The scope is at max_observations_per_scope.
  APPLY_OUTCOME_CAPACITY_EXCEEDED = 4;
}

// ApplyBatchResult reports the outcome.
message ApplyBatchResult {
  ApplyOutcome outcome = 1;
  int32 ops_applied = 2;
  // DISCARDED: input facts that are no longer live (the workflow drops them
  // from the batch and re-queues it with a new batch_key).
  repeated string missing_fact_ids = 3;
  // DISCARDED: shown candidate versions that failed re-verification (the
  // workflow re-runs FindCandidates, which never returns a flagged version).
  repeated ObservationVersionRef flagged_candidate_versions = 4;
}

// RefreshPageInput starts a page refresh workflow.
message RefreshPageInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  string page_id = 4;
  RefreshReason reason = 5;
  // Version the delta edit starts from (0 = full write).
  int64 base_version = 6;
  ResolvedModels models = 7;
  bool force_full_rewrite = 8;
}

// RefreshReason says why a page refresh runs.
enum RefreshReason {
  REFRESH_REASON_UNSPECIFIED = 0;
  REFRESH_REASON_WRITE = 1;
  REFRESH_REASON_DELETE = 2;
  REFRESH_REASON_SCHEDULE = 3;
  REFRESH_REASON_MANUAL = 4;
  REFRESH_REASON_CREATE = 5;
}

// RefreshPageResult reports the new version.
message RefreshPageResult {
  int64 version = 1;
  string markdown_blob_key = 2;
  google.protobuf.Timestamp effective_at = 3;
  int32 sources_added = 4;
  int32 sources_removed = 5;
  TokenUsage usage = 6;
}

// PurgeTarget selects what a purge removes.
enum PurgeTarget {
  PURGE_TARGET_UNSPECIFIED = 0;
  // Everything of one document (explicit delete; grace 0).
  PURGE_TARGET_DOCUMENT = 1;
  // Everything of the namespace on this shard.
  PURGE_TARGET_NAMESPACE = 2;
  // Retired rows older than `grace` across the namespace (grace 1 h).
  PURGE_TARGET_RETIRED_SWEEP = 3;
  // Rows left on a move source after the 24 h grace.
  PURGE_TARGET_MOVED_OUT = 4;
}

// PurgeInput starts the PurgeWorkflow.
message PurgeInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  PurgeTarget target = 4;
  string document_id = 5;
  // Versions to purge (empty = all versions of the document).
  repeated int64 versions = 6;
  google.protobuf.Duration grace = 7;
  // Rows per delete batch (default 10 000).
  int32 batch_size = 8;
  // xcache/ecache/staging blobs are deleted only when no live chunk
  // references the hash AND the blob is older than this (default 24 h, longer
  // than the maximum in-flight activity age; decision N100).
  google.protobuf.Duration xcache_grace = 9;
}

// PurgeResult reports counts.
message PurgeResult {
  int64 rows_purged = 1;
  int64 blobs_purged = 2;
  int32 batches = 3;
}

// ExportInput starts a snapshot workflow.
message ExportInput {
  uint32 schema_version = 1;
  WorkflowScope scope = 2;
  string operation_id = 3;
  int64 version = 4;
  // Previous version for the delta file (0 = none).
  int64 base_version = 5;
  bool include_chunks = 6;
  bool include_pages = 7;
  // Outbox positions bounding the delta.
  int64 base_outbox_seq = 8;
  int64 outbox_seq = 9;
}

// ExportResult reports the written files.
message ExportResult {
  int64 version = 1;
  string manifest_blob_key = 2;
  int64 total_bytes = 3;
  bool delta_written = 4;
}

// MoveInput starts the move executor workflow (`move/{namespace_id}/{epoch}`)
// on the TARGET shard's task queue (`shard-{target_shard_id}`, register N2).
// The executing worker opens a second, move-scoped pool to the source shard
// (role `engram_move`); it is the only code path that holds two shard handles.
message MoveInput {
  uint32 schema_version = 1;
  string move_id = 2;
  string namespace_id = 3;
  string tenant_id = 4;
  int32 source_shard_id = 5;
  int32 target_shard_id = 6;
  int64 source_epoch = 7;
  int64 target_epoch = 8;
  string source_blob_prefix = 9;
  string target_blob_prefix = 10;
  bool pause_before_freeze = 11;
  // Freeze watchdog: max(120 s, 60 s + 1 s per 10,000 live facts), capped at
  // 15 min, computed by Plan from the stats row (decision N90). Armed until
  // cutover sub-step (c) commits (N98).
  google.protobuf.Duration freeze_watchdog = 12;
}

// CopyProgress is the Copy activity's heartbeat and resume payload (decision
// N88): each table is copied in key ranges (≤ 100,000 rows or ≤ 60 s), each
// range under its own short REPEATABLE READ snapshot (N89); ranges are
// idempotent, so a crashed Copy resumes at the first range without a
// completion mark.
message CopyProgress {
  string table = 1;
  // Primary-key value of the last row of the last completed range, in the
  // table's key encoding (empty before the first range).
  bytes last_key = 2;
  int64 rows_done = 3;
  // Index of the table in the dependency-ordered copy list.
  int32 table_index = 4;
  // Opaque continuation token of the blob copy listing.
  string blob_token = 5;
}

// MoveCheckpoint is persisted after every step so the executor is
// restartable (decision D5 states).
message MoveCheckpoint {
  string state = 1;
  // p0: max(outbox.seq) read inside the copy snapshot. Replay is the anti-join
  // `seq > p0 AND NOT EXISTS (move_applied)` (decision N50); applied_seq is
  // informational, never a read cursor.
  int64 copy_start_seq = 2;
  int64 applied_seq = 3;
  repeated string tables_done = 4;
  repeated string terminated_operation_ids = 5;
  google.protobuf.Timestamp frozen_at = 6;
  // Workflow ids recorded by Drain from the source `operations` rows in
  // RUNNING/PENDING/DEFERRED plus the namespace singletons (never from
  // Temporal visibility, decision N97). Restart starts each on the target
  // queue with a memo `epoch = e + 1` and WorkflowIDReusePolicy
  // TERMINATE_IF_RUNNING.
  repeated string drained_workflow_ids = 7;
  // Watermark W of the pre-freeze deep verify: the stable cohort is
  // created_at < W (decision N90).
  google.protobuf.Timestamp verify_watermark = 8;
  // Cutover sub-step last committed: "", "a", "b", "c" or "d". The point of
  // no return is (c) (decision N98).
  string cutover_step = 9;
}

// MoveResult is the terminal outcome.
message MoveResult {
  string final_state = 1;
  int64 rows_copied = 2;
  int64 events_replayed = 3;
  repeated string restarted_operation_ids = 4;
  string error = 5;
}
