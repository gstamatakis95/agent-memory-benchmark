// memory/v1/document.proto
//
// DocumentService: read and delete documents (the client-addressed unit of
// retain and delete). Documents are created only through
// MemoryService.Retain; this service never writes content.
//
// DeleteDocument is UNARY and returns an Operation because the delete has two
// halves (decisions D8, N115, N119). The synchronous half is an O(1)
// soft-delete marker: the delete intent object is written to blob storage
// (N122), then one shard transaction inserts a document tombstone, flips the
// document to DELETING and writes the outbox event, and the call returns. From
// that ack on, every read path (Recall, Reflect, GetMemory, ListMemories,
// GetPage, SearchPages, StreamSnapshot) hides everything derived from the
// document, evaluated at read time against the tombstone set (N116, N117);
// nothing is walked or stamped at delete time. The asynchronous half is the
// throttled per-namespace Expunge workflow (N119) that the returned
// Operation tracks: materialize (<= 15 min), purge rows and blobs (<= 24 h),
// index rebuild (<= 48 h). Recall SLOs may degrade for the namespace while
// the tombstone is pending. A client that needs "no longer returned" needs
// nothing beyond the ack; one that needs "storage reclaimed" waits on the
// Operation.
syntax = "proto3";

package memory.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";
import "memory/v1/operation.proto";

option go_package = "example.com/engram/gen/go/memory/v1;memoryv1";

// DocumentService reads and deletes documents. Scope memory.read for
// Get/List, memory.write for Delete.
service DocumentService {
  // GetDocument returns document metadata and, optionally, its version list.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListDocuments pages through documents of a namespace, most recently
  // updated first.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // DeleteDocument soft-deletes a document and everything derived from it.
  // The ack means: the intent object is durable (N122) and the tombstone
  // marker is committed (N115), so the delete is effective for every read
  // path and survives restore and failover (acknowledged deletes have RPO 0).
  // Cost: one blob put (10-50 ms) plus one small transaction, independent of
  // document size. The returned Operation (kind DELETE_DOCUMENT) tracks the
  // asynchronous Expunge. Deleting an unknown document returns NOT_FOUND;
  // deleting a document that is already DELETING returns the existing
  // operation (idempotent).
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  // GetDocumentVersion returns one version's metadata (chunk/fact counts,
  // status, the operation that produced it).
  rpc GetDocumentVersion(GetDocumentVersionRequest) returns (GetDocumentVersionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// DocumentState is the lifecycle of a document.
enum DocumentState {
  DOCUMENT_STATE_UNSPECIFIED = 0;
  // Has at least one active version.
  DOCUMENT_STATE_ACTIVE = 1;
  // First version still ingesting; nothing visible yet.
  DOCUMENT_STATE_INGESTING = 2;
  // Tombstone committed (the delete is effective); expunge in progress. Not
  // returned by List unless `include_deleting`.
  DOCUMENT_STATE_DELETING = 3;
}

// DocumentVersionStatus is the lifecycle of one version.
enum DocumentVersionStatus {
  DOCUMENT_VERSION_STATUS_UNSPECIFIED = 0;
  DOCUMENT_VERSION_STATUS_INGESTING = 1;
  DOCUMENT_VERSION_STATUS_ACTIVE = 2;
  // Replaced by a newer version; its unchanged chunks live on in the newer
  // version, its removed chunks are hidden by chunk tombstones.
  DOCUMENT_VERSION_STATUS_SUPERSEDED = 3;
  DOCUMENT_VERSION_STATUS_DELETED = 4;
}

// Document is the public view of a document.
message Document {
  NamespaceRef namespace = 1;
  string document_id = 2;
  // Highest version number; 0 while the first version is ingesting.
  int64 current_version = 3;
  DocumentState state = 4;
  // Content hash of the current version (hex SHA-256 over the concatenated
  // item content).
  string content_hash = 5;
  // Visible chunk and fact counts.
  int32 chunk_count = 6;
  int32 fact_count = 7;
  // Union of item tags of the current version.
  repeated string tags = 8;
  // Metadata of the first item of the current version.
  google.protobuf.Struct metadata = 9;
  // LLM document summary (≤ 200 chars) used in chunk headers.
  string summary = 10;
  Timestamps timestamps = 11;
  // Operation that produced the current version.
  string last_operation_id = 12;
  // Versions, newest first; only when GetDocumentRequest.include_versions.
  repeated DocumentVersion versions = 13;
  // Free-text context of the current version.
  string context = 14;

  reserved 100 to 199;
}

// DocumentVersion describes one retain of a document.
message DocumentVersion {
  int64 version = 1;
  string content_hash = 2;
  DocumentVersionStatus status = 3;
  string operation_id = 4;
  UpdateMode update_mode = 5;
  int32 chunk_count = 6;
  // Chunks reused unchanged from the previous version (delta retain).
  int32 chunks_reused = 7;
  int32 fact_count = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp activated_at = 10;
}

// GetDocumentRequest fetches one document.
message GetDocumentRequest {
  NamespaceRef namespace = 1;
  string document_id = 2;
  google.protobuf.FieldMask read_mask = 3;
  // Also return `versions`.
  bool include_versions = 4;

  reserved 100 to 199;
}

// GetDocumentResponse wraps the document.
message GetDocumentResponse {
  Document document = 1;

  reserved 100 to 199;
}

// ListDocumentsRequest lists documents, most recently updated first.
message ListDocumentsRequest {
  NamespaceRef namespace = 1;
  PagingRequest paging = 2;
  // Tag filter over the document's tag union.
  TagFilter tag_filter = 3;
  // Prefix match on document_id (e.g. "session-2026-09-").
  string document_id_prefix = 4;
  // Only documents updated at or after this time.
  google.protobuf.Timestamp updated_after = 5;
  // Also return documents in state DELETING.
  bool include_deleting = 6;
  google.protobuf.FieldMask read_mask = 7;
  repeated MetadataFilter metadata_filters = 8;

  reserved 100 to 199;
}

// ListDocumentsResponse is a page of documents.
message ListDocumentsResponse {
  repeated Document documents = 1;
  PagingResponse paging = 2;

  reserved 100 to 199;
}

// DeleteDocumentRequest removes a document.
message DeleteDocumentRequest {
  NamespaceRef namespace = 1;
  RequestMeta meta = 2;
  string document_id = 3;
  // Optional client-chosen operation id (UUIDv7).
  string operation_id = 4;
  // When > 0, the delete only proceeds if current_version equals this value
  // (FAILED_PRECONDITION + PreconditionFailed{ETAG_MISMATCH} otherwise).
  int64 expected_version = 5;

  reserved 100 to 199;
}

// DeleteDocumentResponse acknowledges the tombstone (decision N115) and
// returns the expunge operation.
message DeleteDocumentResponse {
  Operation operation = 1;
  // Removed in v1.0.0-rc6 (decisions N115, N117): `int32 facts_retired = 2`,
  // `int32 observations_marked_stale = 3`, `int32 pages_marked_stale = 4`.
  // Nothing is counted at delete time any more; the expunge reports progress.
  reserved 2 to 4;
  reserved "facts_retired", "observations_marked_stale", "pages_marked_stale";
  // Commit time of the tombstone: the instant from which no read path returns
  // anything derived from the document.
  google.protobuf.Timestamp deleted_at = 5;
  // Stated bounds of the asynchronous expunge.
  ExpungeSla expunge_sla = 6;

  reserved 100 to 199;
}

// GetDocumentVersionRequest fetches one version.
message GetDocumentVersionRequest {
  NamespaceRef namespace = 1;
  string document_id = 2;
  // 0 = current version.
  int64 version = 3;

  reserved 100 to 199;
}

// GetDocumentVersionResponse wraps the version.
message GetDocumentVersionResponse {
  DocumentVersion document_version = 1;

  reserved 100 to 199;
}
