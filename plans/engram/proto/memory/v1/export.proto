// memory/v1/export.proto
//
// ExportService (phase 3): per-namespace snapshots to blob storage under the
// namespace's shard prefix (`{shard}/{tenant}/{ns}/export/v{n}/…`, decision
// D12), served back to thin clients that sync them next to an agent for
// grep-style local search.
//
// Versions are dense integers per namespace. Snapshot v{n} always contains a
// full set of files and, for n > 1, ALWAYS contains
// `delta-v{n-1}-v{n}.jsonl.zst`, computed by diffing the two snapshots by
// (id, version) with delete records, and lists `deleted_ids` in its manifest,
// even when v{n-1} has expired or been garbage-collected (decision N126). A
// client at v{n-1} downloads only the delta and applies the deletes before
// serving anything; a client further behind applies consecutive deltas or
// falls back to the full files. A local copy whose version is `expired` is
// refused by the sync client until it has applied the next delta (the delta
// carries the delete records).
//
// Curation (decision N126). The files are built through the read-time
// visibility predicate at write time and are static afterwards (a compressed
// byte stream cannot be filtered on read). A delete therefore EXPIRES the
// snapshots that could contain the document; Invalidate and Restore never
// expire a snapshot. Instead GetSnapshotManifest returns a live
// `hidden_overlay` (the currently invalidated facts and the hidden derived
// versions) that the sync client applies before serving, so curation reaches a
// synced agent within one manifest poll and the next snapshot honours it.
// After a delete expired the latest ready snapshot, the expunge starts a
// system-initiated snapshot (debounced 10 min per namespace), so read-only
// sync clients regain a servable copy.
//
// StreamSnapshot is SERVER-STREAMING: parts of ≤ 1 MiB, resumable by
// (path, offset). Unary "download a file" was rejected because gRPC messages
// should stay ≤ 4 MiB and files reach gigabytes.
syntax = "proto3";

package memory.v1;

import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";
import "memory/v1/operation.proto";

option go_package = "example.com/engram/gen/go/memory/v1;memoryv1";

// ExportService creates and serves snapshots. CreateSnapshot needs
// memory.write (it consumes worker capacity and storage); the reads need
// memory.read.
service ExportService {
  // CreateSnapshot starts a snapshot (kind CREATE_SNAPSHOT) and returns the
  // Operation. BeginSnapshot inserts the snapshot as `building` and records
  // an insertion-sequence watermark; the files are written in short
  // READ COMMITTED key ranges bounded by that watermark, with the marker sets
  // read once (no long snapshot is held); RecordSnapshot refuses to promote a
  // row that a delete expired in between (decision N126). At most one
  // snapshot per namespace runs at a time (ABORTED + OperationConflict
  // otherwise). The same workflow is started by the expunge after a delete
  // expired the latest ready snapshot (system-initiated, no caller scope).
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  // GetSnapshotManifest returns the manifest of one version (0 = latest) and
  // the live curation overlay (decision N126). The overlay is computed at
  // read time and is never part of the stored manifest.json.
  rpc GetSnapshotManifest(GetSnapshotManifestRequest) returns (GetSnapshotManifestResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListSnapshots lists manifests, newest first.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // StreamSnapshot streams one file of a snapshot in parts of ≤ 1 MiB from a
  // byte offset. The last part carries the file's SHA-256. A version marked
  // `expired` (a document in it, or in it while it was `building`, was
  // deleted since, decision N126) is refused with FAILED_PRECONDITION +
  // PreconditionFailed{SNAPSHOT_EXPIRED}: the client takes the next
  // snapshot's delta or a new full snapshot. The parts are the stored bytes
  // and are NOT filtered on read: deletes are handled by expiry, curation by
  // the manifest's hidden_overlay (decision N126).
  rpc StreamSnapshot(StreamSnapshotRequest) returns (stream StreamSnapshotResponse);
}

// SnapshotFileKind classifies a file in a snapshot.
enum SnapshotFileKind {
  SNAPSHOT_FILE_KIND_UNSPECIFIED = 0;
  // manifest.json (also returned inline as SnapshotManifest).
  SNAPSHOT_FILE_KIND_MANIFEST = 1;
  // facts.jsonl.zst: one Memory (kind FACT) per line; facts invisible when
  // the file was written (tombstoned documents, fact_hidden) are excluded.
  // Curation after that instant is the manifest's hidden_overlay.
  SNAPSHOT_FILE_KIND_FACTS = 2;
  // observations.jsonl.zst: latest visible version of each observation.
  SNAPSHOT_FILE_KIND_OBSERVATIONS = 3;
  // chunks.jsonl.zst: visible chunks with header and provenance.
  SNAPSHOT_FILE_KIND_CHUNKS = 4;
  // pages/<name>.md: current version of each page.
  SNAPSHOT_FILE_KIND_PAGE = 5;
  // delta-v{n-1}-v{n}.jsonl.zst: upsert and delete records between the
  // previous version and this one, from a diff of the two snapshots.
  SNAPSHOT_FILE_KIND_DELTA = 6;
}

// SnapshotFile describes one file of a snapshot.
message SnapshotFile {
  // Path relative to the snapshot root, e.g. "facts.jsonl.zst",
  // "pages/q3-plan.md".
  string path = 1;
  SnapshotFileKind kind = 2;
  int64 size_bytes = 3;
  // Hex SHA-256 of the file bytes as streamed (compressed where applicable).
  string sha256 = 4;
  // "zstd" or "" (identity).
  string content_encoding = 5;
  // Records in the file (lines for JSONL).
  int64 record_count = 6;
}

// SnapshotManifest describes one snapshot version.
message SnapshotManifest {
  NamespaceRef namespace = 1;
  int64 version = 2;
  // Version the delta file is relative to; 0 for version 1.
  int64 base_version = 3;
  // True for every version above 1: the delta is always emitted (decision
  // N126).
  bool delta_available = 4;
  // Consistent point of the snapshot: the start of the build. Insert-only rows
  // are bounded by the insertion-sequence watermark taken then; everything
  // committed before it and visible then is included.
  google.protobuf.Timestamp as_of = 5;
  repeated SnapshotFile files = 6;
  int64 total_bytes = 7;
  string operation_id = 8;
  google.protobuf.Timestamp created_at = 9;
  // Schema version of the JSONL record format ("1").
  string format_version = 10;
  // Counts for quick sanity checks.
  int64 fact_count = 11;
  int64 observation_count = 12;
  int64 chunk_count = 13;
  int32 page_count = 14;
  // True when a document contained in this snapshot was deleted after it was
  // taken or while it was being built (decision N126): the delete marker
  // transaction expires `building` and `ready` snapshots alike, so an
  // acknowledged delete cannot be served through an old export. Expired
  // versions stay listed (so a client learns why its chain is broken) but
  // StreamSnapshot refuses them.
  bool expired = 15;
  google.protobuf.Timestamp expired_at = 16;
  // Ids (facts, chunks, observations) deleted between base_version and this
  // version, also when the base snapshot has expired (decision N126). The
  // sync client applies them before serving. Long lists are paged into the
  // delta file's delete records; this field holds at most the first 10,000.
  repeated string deleted_ids = 17;

  reserved 100 to 199;
}

// HiddenVersion names a derived version that the read predicate hides now.
message HiddenVersion {
  // Which kind of derived version.
  HiddenKind kind = 1;
  // Observation id or page id.
  string id = 2;
  // The hidden range: every version of the observation or page whose
  // root_version equals `root_version` and whose version is at least
  // `from_version` is hidden (decision N117).
  int64 root_version = 3;
  int64 from_version = 4;
}

// HiddenKind says what a HiddenVersion names.
enum HiddenKind {
  HIDDEN_KIND_UNSPECIFIED = 0;
  HIDDEN_KIND_OBSERVATION = 1;
  HIDDEN_KIND_PAGE = 2;
}

// HiddenOverlay is the live curation state that the sync client applies to a
// snapshot before serving it (decision N126): the facts currently invalidated
// (`fact_hidden` with cause `invalidate`) and the derived versions currently
// hidden (`derived_hidden` rows). It is computed when the manifest is read,
// is paged (the first page comes with the manifest) and reflects Restore as
// well: a restored fact is simply absent.
message HiddenOverlay {
  // Ids of invalidated facts.
  repeated string hidden_memory_ids = 1;
  repeated HiddenVersion hidden_versions = 2;
  // When the overlay was computed.
  google.protobuf.Timestamp computed_at = 3;
  // Non-empty while more overlay rows exist; pass it as
  // GetSnapshotManifestRequest.overlay_page_token.
  string next_page_token = 4;

  reserved 100 to 199;
}

// CreateSnapshotRequest starts a snapshot.
message CreateSnapshotRequest {
  NamespaceRef namespace = 1;
  RequestMeta meta = 2;
  string operation_id = 3;
  // Include chunks.jsonl.zst (largest file; default false).
  bool include_chunks = 4;
  // Include pages/*.md (default true when unset).
  optional bool include_pages = 5;

  reserved 100 to 199;
}

// CreateSnapshotResponse returns the snapshot operation; the version is in
// OperationResult.snapshot_version once SUCCEEDED.
message CreateSnapshotResponse {
  Operation operation = 1;

  reserved 100 to 199;
}

// GetSnapshotManifestRequest fetches a manifest.
message GetSnapshotManifestRequest {
  NamespaceRef namespace = 1;
  // 0 = latest completed version.
  int64 version = 2;
  // Continuation of the overlay (HiddenOverlay.next_page_token); empty on the
  // first call.
  string overlay_page_token = 3;

  reserved 100 to 199;
}

// GetSnapshotManifestResponse wraps the manifest and the live overlay.
message GetSnapshotManifestResponse {
  SnapshotManifest manifest = 1;
  // Live curation overlay, applied by engram-sync before serving.
  HiddenOverlay hidden_overlay = 2;

  reserved 100 to 199;
}

// ListSnapshotsRequest lists manifests, newest first.
message ListSnapshotsRequest {
  NamespaceRef namespace = 1;
  PagingRequest paging = 2;

  reserved 100 to 199;
}

// ListSnapshotsResponse is a page of manifests.
message ListSnapshotsResponse {
  repeated SnapshotManifest manifests = 1;
  PagingResponse paging = 2;

  reserved 100 to 199;
}

// StreamSnapshotRequest selects one file and a resume offset.
message StreamSnapshotRequest {
  NamespaceRef namespace = 1;
  int64 version = 2;
  // File path from the manifest.
  string path = 3;
  // Byte offset to resume from (0 = start). Must be < size_bytes.
  int64 offset = 4;

  reserved 100 to 199;
}

// StreamSnapshotResponse is one part of the file.
message StreamSnapshotResponse {
  string path = 1;
  // Offset of `data` within the file.
  int64 offset = 2;
  // ≤ 1 MiB (1,048,576 bytes).
  bytes data = 3;
  // True on the last part.
  bool last = 4;
  // Hex SHA-256 of the whole file; set only when `last`.
  string sha256 = 5;

  reserved 100 to 199;
}
